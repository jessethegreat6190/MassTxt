<script>
// ════════════════════════════════════════════════════════════
//  MassTxt v2.0 — Standalone HTML Edition
//  Runs in Chrome/Edge with NO installation needed
//  Uses: WebSerial API (modem) + IndexedDB (storage)
// ════════════════════════════════════════════════════════════

// ── IndexedDB Storage Layer ──────────────────────────────────
const DB = {
  _db: null,
  async open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open('masstxt', 3);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('contacts'))
          db.createObjectStore('contacts', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('groups'))
          db.createObjectStore('groups', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('messages'))
          db.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('message_logs'))
          db.createObjectStore('message_logs', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('templates'))
          db.createObjectStore('templates', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('inbox'))
          db.createObjectStore('inbox', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('settings'))
          db.createObjectStore('settings', { keyPath: 'key' });
      };
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror   = e => rej(e.target.error);
    });
  },
  tx(store, mode = 'readonly') { return this._db.transaction(store, mode).objectStore(store); },
  async getAll(store) {
    return new Promise((res, rej) => {
      const req = this.tx(store).getAll();
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  },
  async get(store, key) {
    return new Promise((res, rej) => {
      const req = this.tx(store).get(key);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  },
  async put(store, value) {
    return new Promise((res, rej) => {
      const req = this.tx(store, 'readwrite').put(value);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  },
  async add(store, value) {
    return new Promise((res, rej) => {
      const req = this.tx(store, 'readwrite').add(value);
      req.onsuccess = e => { value.id = e.target.result; res(value); };
      req.onerror   = e => rej(e.target.error);
    });
  },
  async delete(store, key) {
    return new Promise((res, rej) => {
      const req = this.tx(store, 'readwrite').delete(key);
      req.onsuccess = () => res(true);
      req.onerror   = e => rej(e.target.error);
    });
  },
  async clear(store) {
    return new Promise((res, rej) => {
      const req = this.tx(store, 'readwrite').clear();
      req.onsuccess = () => res(true);
      req.onerror   = e => rej(e.target.error);
    });
  }
};

// ── Settings helper ───────────────────────────────────────────
const Settings = {
  _cache: {},
  async load() {
    const all = await DB.getAll('settings');
    all.forEach(s => { this._cache[s.key] = s.value; });
    if (!this._cache.sender_id)            { this._cache.sender_id = 'MassTxt'; }
    if (!this._cache.default_country_code) { this._cache.default_country_code = '+256'; }
    if (!this._cache.msg_delay_ms)         { this._cache.msg_delay_ms = '800'; }
    if (!this._cache.retry_count)          { this._cache.retry_count = '2'; }
    if (!this._cache.default_sms_type)     { this._cache.default_sms_type = 'normal'; }
    if (!this._cache.flash_dcs)            { this._cache.flash_dcs = '240'; }
    return this._cache;
  },
  get(key) { return this._cache[key]; },
  async set(updates) {
    Object.assign(this._cache, updates);
    for (const [key, value] of Object.entries(updates)) {
      await DB.put('settings', { key, value: String(value) });
    }
  }
};

// ── WebSerial Modem ───────────────────────────────────────────
const Modem = {
  port: null,
  reader: null,
  writer: null,
  connected: false,
  portInfo: '',
  signalStrength: 0,
  _buffer: '',
  _resolver: null,
  _responseLines: [],
  _atTimeout: null,
  _incomingSmsFrom: null,
  onIncomingSMS: null,
  onStatusChange: null,

  async listPorts() {
    if (!navigator.serial) return [];
    const ports = await navigator.serial.getPorts();
    return ports.map(p => ({ port: p, info: p.getInfo() }));
  },

  async requestPort() {
    if (!navigator.serial) throw new Error('WebSerial not supported. Use Chrome or Edge browser.');
    return await navigator.serial.requestPort({ filters: [] });
  },

  async connect(port, baudRate = 115200) {
    try {
      await port.open({ baudRate: parseInt(baudRate) });
      this.port = port;
      this.connected = true;
      const textDecoder = new TextDecoderStream();
      const textEncoder = new TextEncoderStream();
      port.readable.pipeTo(textDecoder.writable);
      textEncoder.readable.pipeTo(port.writable);
      this.reader = textDecoder.readable.getReader();
      this.writer = textEncoder.writable.getWriter();
      this._startReading();
      await this._initModem();
      this.portInfo = port.getInfo()?.usbVendorId ? `USB ${port.getInfo().usbVendorId}` : 'Serial Port';
      this._updateUI();
      return true;
    } catch(e) {
      this.connected = false;
      throw e;
    }
  },

  async _startReading() {
    try {
      while (this.reader) {
        const { value, done } = await this.reader.read();
        if (done) { this.connected = false; this._updateUI(); break; }
        this._buffer += value;
        const lines = this._buffer.split('\r\n');
        this._buffer = lines.pop();
        lines.forEach(l => this._handleLine(l.trim()));
      }
    } catch(e) {
      this.connected = false;
      this._updateUI();
    }
  },

  _handleLine(line) {
    if (!line) return;
    if (line.startsWith('+CMT:')) {
      const m = line.match(/\+CMT:\s*"([^"]+)"/);
      this._incomingSmsFrom = m ? m[1] : 'Unknown';
      return;
    }
    if (this._incomingSmsFrom) {
      if (this.onIncomingSMS) this.onIncomingSMS(this._incomingSmsFrom, line);
      this._storeIncomingSMS(this._incomingSmsFrom, line);
      this._incomingSmsFrom = null;
      return;
    }
    if (line.startsWith('+CSQ:')) {
      const raw = parseInt(line.replace('+CSQ:', '').split(',')[0]);
      this.signalStrength = raw === 99 ? 0 : Math.min(5, Math.round((raw / 31) * 5));
      setSignal(this.signalStrength);
    }
    if (this._resolver) {
      this._responseLines.push(line);
      if (line === 'OK' || line === 'ERROR' || line.startsWith('+CMS ERROR') || line === '>') {
        const res = this._responseLines.join('\n');
        const resolver = this._resolver;
        this._resolver = null;
        this._responseLines = [];
        clearTimeout(this._atTimeout);
        resolver(res);
      }
    }
  },

  async _storeIncomingSMS(phone, body) {
    try {
      const contacts = await DB.getAll('contacts');
      const c = contacts.find(x => x.phone === phone);
      await DB.add('inbox', { phone, contact_name: c?.name || null, body, received_at: new Date().toISOString(), read_flag: 0 });
      const unread = (await DB.getAll('inbox')).filter(m => !m.read_flag).length;
      setNavBadge('inbox', unread);
      if (document.getElementById('page-inbox').style.display !== 'none') inboxPage.load();
    } catch(e) {}
  },

  async sendAT(cmd, ms = 5000) {
    if (!this.writer) throw new Error('Not connected');
    this._responseLines = [];
    const promise = new Promise((res, rej) => {
      this._resolver = res;
      this._atTimeout = setTimeout(() => { this._resolver = null; rej(new Error('AT timeout: ' + cmd)); }, ms);
    });
    await this.writer.write(cmd + '\r\n');
    return promise;
  },

  async _initModem() {
    await this.sendAT('AT');
    await this.sendAT('ATE0');
    await this.sendAT('AT+CMGF=1');
    await this.sendAT('AT+CSCS="GSM"');
    try { await this.sendAT('AT+CNMI=2,2,0,0,0'); } catch(e) {}
    const csq = await this.sendAT('AT+CSQ');
    const m = csq.match(/\+CSQ:\s*(\d+)/);
    if (m) { const raw = parseInt(m[1]); this.signalStrength = raw === 99 ? 0 : Math.min(5, Math.round((raw/31)*5)); }
  },

  async sendSMS(phone, message, options = {}) {
    if (!this.connected) throw new Error('Modem not connected');
    const flash = !!options.flash;
    // Class 0 (flash) SMS is shown immediately on the handset and is not stored
    // in the inbox. AT+CSMP sets <fo>,<vp>,<pid>,<dcs>; DCS 240 (0xF0) selects
    // the 7-bit default alphabet with message class 0. Some modems expect 16
    // (0x10) instead, so the value is configurable in Settings.
    const flashDcs = Settings.get('flash_dcs') || '240';
    if (flash) await this.sendAT(`AT+CSMP=17,167,0,${flashDcs}`);
    try {
      await this.sendAT(`AT+CMGS="${phone}"`, 4000);
      const promise = new Promise((res, rej) => {
        this._responseLines = [];
        this._resolver = r => { if (r.includes('+CMGS:') || r.includes('OK')) res(true); else rej(new Error('Send failed: ' + r)); };
        this._atTimeout = setTimeout(() => { this._resolver = null; rej(new Error('SMS send timeout')); }, 30000);
      });
      await this.writer.write(message + '\x1A');
      return await promise;
    } finally {
      // Always restore normal (class 1 / stored) SMS for the next send.
      if (flash) { try { await this.sendAT('AT+CSMP=17,167,0,0'); } catch(e) {} }
    }
  },

  async getSignal() {
    if (!this.connected) return 0;
    try { const r = await this.sendAT('AT+CSQ'); const m = r.match(/\+CSQ:\s*(\d+)/); if (m) { const raw = parseInt(m[1]); this.signalStrength = raw === 99 ? 0 : Math.min(5, Math.round((raw/31)*5)); } } catch(e) {}
    return this.signalStrength;
  },

  async disconnect() {
    try { if (this.reader) { await this.reader.cancel(); this.reader = null; } if (this.port) { await this.port.close(); this.port = null; } } catch(e) {}
    this.connected = false; this._updateUI();
  },

  _updateUI() {
    const dot   = document.getElementById('modem-dot');
    const label = document.getElementById('modem-label');
    if (dot)   dot.className   = 'modem-dot' + (this.connected ? ' connected' : '');
    if (label) label.textContent = this.connected ? (this.portInfo || 'Connected') : 'Not connected';
    if (this.onStatusChange) this.onStatusChange(this.connected);
  }
};

// ── Bulk Send Engine ─────────────────────────────────────────
const SendQueue = { active: false, paused: false, cancel: false };

async function executeBulkSend(messageId, onProgress) {
  const messages   = await DB.getAll('messages');
  const msg        = messages.find(m => m.id === messageId);
  if (!msg) return;

  const delay      = parseInt(Settings.get('msg_delay_ms')) || 800;
  const retryCount = parseInt(Settings.get('retry_count'))  || 2;
  const logs       = (await DB.getAll('message_logs')).filter(l => l.message_id === messageId && l.status === 'pending');

  msg.status     = 'sending';
  msg.started_at = new Date().toISOString();
  await DB.put('messages', msg);

  SendQueue.active = true; SendQueue.paused = false; SendQueue.cancel = false;
  let sent = 0, failed = 0;

  for (const log of logs) {
    while (SendQueue.paused && !SendQueue.cancel) await sleep(400);
    if (SendQueue.cancel) {
      msg.status = 'cancelled'; msg.completed_at = new Date().toISOString();
      await DB.put('messages', msg);
      if (onProgress) onProgress({ status: 'cancelled', total: logs.length, sent, failed });
      SendQueue.active = false;
      return;
    }

    // Personalize
    const body = msg.body
      .replace(/\{name\}/gi,  log.contact_name || log.phone)
      .replace(/\{first\}/gi, (log.contact_name || '').split(' ')[0] || log.phone)
      .replace(/\{phone\}/gi, log.phone);

    let success = false, lastError = '';
    for (let i = 0; i <= retryCount; i++) {
      try { await Modem.sendSMS(log.phone, body, { flash: !!msg.is_flash }); success = true; break; }
      catch(e) { lastError = e.message || String(e); if (i < retryCount) await sleep(1500); }
    }

    if (success) { log.status = 'sent'; log.sent_at = new Date().toISOString(); sent++; }
    else         { log.status = 'failed'; log.error_text = lastError; failed++; }
    await DB.put('message_logs', log);

    msg.sent_count    = sent;
    msg.failed_count  = failed;
    msg.pending_count = logs.length - sent - failed;
    await DB.put('messages', msg);

    if (onProgress) onProgress({ status: 'sending', total: logs.length, sent, failed, pending: logs.length - sent - failed });
    await sleep(delay);
  }

  const finalStatus = failed === 0 ? 'completed' : sent === 0 ? 'failed' : 'partial';
  msg.status = finalStatus; msg.completed_at = new Date().toISOString();
  await DB.put('messages', msg);
  if (onProgress) onProgress({ status: finalStatus, total: logs.length, sent, failed });
  SendQueue.active = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── CSV / Excel Import (pure JS) ─────────────────────────────
async function importFileToContacts(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = async e => {
      let rows = [];
      const name = file.name.toLowerCase();

      if (name.endsWith('.csv') || name.endsWith('.tsv')) {
        const sep = name.endsWith('.tsv') ? '\t' : ',';
        const lines = e.target.result.trim().split('\n');
        const header = lines[0].split(sep).map(h => h.trim().replace(/"/g,'').toLowerCase());
        const ni = header.findIndex(h => h.includes('name'));
        const pi = header.findIndex(h => h.includes('phone') || h.includes('mobile') || h.includes('number'));
        const gi = header.findIndex(h => h.includes('group'));
        if (pi === -1) { resolve({ success: false, error: 'No phone column found' }); return; }
        rows = lines.slice(1).map(l => {
          const c = l.split(sep).map(x => x.trim().replace(/"/g,''));
          return { name: ni >= 0 ? c[ni] : '', phone: c[pi] || '', group_name: gi >= 0 ? c[gi] : 'General' };
        });
      } else if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.ods')) {
        // SheetJS bundled from node_modules — always available
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const data  = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        if (!data.length) { resolve({ success: false, error: 'Spreadsheet is empty' }); return; }
        const keys = Object.keys(data[0]);
        const findCol = (...terms) => keys.find(k => terms.some(t => k.toLowerCase().includes(t)));
        const nc = findCol('name'), pc = findCol('phone','mobile','number'), gc = findCol('group');
        if (!pc) { resolve({ success: false, error: 'No phone column found' }); return; }
        rows = data.map(r => ({ name: nc ? String(r[nc]||'') : '', phone: String(r[pc]||''), group_name: gc ? String(r[gc]||'General') : 'General' }));
      }

      // Insert contacts
      const existing = await DB.getAll('contacts');
      const existingPhones = new Set(existing.map(c => c.phone));
      const cc = Settings.get('default_country_code') || '+256';
      let added = 0, skipped = 0, invalid = 0;
      for (const r of rows) {
        let phone = r.phone.trim().replace(/[\s\-\(\)]/g,'');
        if (!phone) { invalid++; continue; }
        if (phone.startsWith('0') && phone.length >= 9) phone = cc + phone.slice(1);
        if (existingPhones.has(phone)) { skipped++; continue; }
        const valid = /^\+?[1-9]\d{6,14}$/.test(phone) ? 1 : 0;
        await DB.add('contacts', { name: r.name || phone, phone, group_name: r.group_name || 'General', notes: '', active: 1, phone_valid: valid, created_at: new Date().toISOString() });
        existingPhones.add(phone);
        added++;
      }
      resolve({ success: true, added, skipped, invalid, total: rows.length });
    };
    if (file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls')) {
      reader.readAsBinaryString(file);
    } else {
      reader.readAsText(file);
    }
  });
}

// ── CSV Export ────────────────────────────────────────────────
function downloadCSV(filename, rows, headers) {
  const csv = [headers.join(','), ...rows.map(r => headers.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

let _bsModal = null;
function showModal(html, onConfirm) {
  const box = document.getElementById('modal-box');
  box.innerHTML = html;
  if (!_bsModal) _bsModal = new bootstrap.Modal(document.getElementById('app-modal'), { backdrop: true });
  _bsModal.show();
  const confirmBtn = box.querySelector('[data-confirm]');
  if (confirmBtn && onConfirm) confirmBtn.addEventListener('click', () => { hideModal(); onConfirm(); }, { once: true });
  const cancelBtn = box.querySelector('[data-cancel]');
  if (cancelBtn) cancelBtn.addEventListener('click', hideModal);
}
function hideModal() {
  if (_bsModal) _bsModal.hide();
  setTimeout(() => { const box = document.getElementById('modal-box'); if (box) box.innerHTML = ''; }, 300);
}
function formatDate(str) {
  if (!str) return '—';
  const d = new Date(str), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  if (diff < 172800) return 'Yesterday';
  return d.toLocaleDateString([], { month:'short', day:'numeric' });
}
function smsInfo(text) {
  const len = text.length, parts = len === 0 ? 1 : len <= 160 ? 1 : Math.ceil(len/153);
  return { len, parts, limit: parts === 1 ? 160 : parts * 153 };
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setSignal(level) { document.querySelectorAll('.bar').forEach(b => b.classList.toggle('active', parseInt(b.dataset.level) <= level)); }
function setNavBadge(id, count) {
  const el = document.getElementById('nav-badge-' + id);
  if (!el) return;
  if (count > 0) { el.textContent = count; el.style.display = ''; } else el.style.display = 'none';
}

    }
    const maxVal = Math.max(...days.map(d => d.sent + d.failed), 1);

      <div class="stat-grid" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat-card"><div class="stat-val">${s.total_contacts}</div><div class="stat-lbl">Total contacts</div></div>
        <div class="stat-card"><div class="stat-val green">${s.today?.sent || 0}</div><div class="stat-lbl">Sent today</div></div>
        <div class="stat-card"><div class="stat-val red">${s.today?.failed || 0}</div><div class="stat-lbl">Failed today</div></div>

      </div>` : ''}`;

  handleProgress(data) {
    const bar = document.getElementById('queue-bar');
    const prog = document.getElementById('queue-bar-progress');
    const text = document.getElementById('queue-bar-text');
    if (!bar) return;
    if (data.status === 'sending') {
      bar.classList.add('show');
      const pct = data.total > 0 ? Math.round((data.sent + data.failed) / data.total * 100) : 0;
      if (prog) prog.style.width = pct + '%';
      if (text) text.textContent = `Sending: ${data.sent} sent · ${data.failed} failed · ${data.pending} remaining`;
    } else {
      bar.classList.remove('show');
      this.load();
    }
  },

  handleQueueChange(data) {
    const btn = document.getElementById('queue-pause-btn');
    if (btn) btn.textContent = data.paused ? 'Resume' : 'Pause';

  async togglePause() {
    const qStatus = await window.api.queue.status();
    if (qStatus.paused) { await window.api.queue.resume(); document.getElementById('queue-pause-btn').textContent = 'Pause'; }
    else { await window.api.queue.pause(); document.getElementById('queue-pause-btn').textContent = 'Resume'; }

  async cancelQueue() {
    showModal(`<div class="modal-title">Cancel send job?</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:8px">Remaining messages will not be sent. Already-sent messages are unaffected.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Keep sending</button><button class="btn btn-danger btn-sm" data-confirm>Cancel job</button></div>`,
      async () => { await window.api.queue.cancel(); document.getElementById('queue-bar')?.classList.remove('show'); });
  }
};

                          <span style="font-size:13px">${escHtml(g.name)}</span>
                          <span class="badge badge-gray">${g.count}</span>
                        </div>
                      </div>`).join('')}

                  <tr><td style="color:var(--text-2);padding:5px 0">SMS parts each</td><td style="text-align:right;font-weight:500" id="sum-parts">1</td></tr>
                  <tr><td style="color:var(--text-2);padding:5px 0">Total messages</td><td style="text-align:right;font-weight:500" id="sum-total">0</td></tr>
                  <tr><td style="color:var(--text-2);padding:5px 0">Message type</td><td style="text-align:right" id="sum-type"><span class="badge badge-gray">Normal</span></td></tr>
                  <tr><td style="color:var(--text-2);padding:5px 0">Device</td><td style="text-align:right" id="sum-device"><span class="badge badge-gray">—</span></td></tr>
                  <tr><td style="color:var(--text-2);padding:5px 0">Personalized</td><td style="text-align:right" id="sum-personal"><span class="badge badge-gray">No</span></td></tr>

    this._devices = devices;

    const settings = await window.api.settings.get();

  isFlash() {
    return !!document.getElementById('flash-sms')?.checked;
  },

  toggleFlash() {
    const on = this.isFlash();
    const hint = document.getElementById('flash-hint');
    if (hint) {
      hint.innerHTML = on
        ? '<strong style="color:var(--amber-dark)">Flash SMS (class 0):</strong> appears on the recipient\'s screen immediately and is <strong>not</strong> saved in their inbox. Supported on GSM modems.'
        : 'Normal SMS is saved in the recipient\'s inbox. Tick <strong>Flash SMS</strong> to make it appear directly on their screen instead.';
    }
    this.updateSummary();
  },

  selectDevice(idx) {
    document.querySelectorAll('.device-chip').forEach((el, i) => {
      el.classList.toggle('device-chip-selected', i === idx);
    });
    this.selectedDevice = this._devices[idx] || null;
    this.updateSummary();
  },

  registerProgressListener() {
    window.api.messages.onProgress((data) => {
      const panel = document.getElementById('send-progress');
      if (!panel) return;
      const pct = data.total > 0 ? Math.round((data.sent + data.failed) / data.total * 100) : 0;
      const bar = document.getElementById('progress-bar');
      if (bar) bar.style.width = pct + '%';
      const stats = document.getElementById('spp-stats');
      if (stats) stats.textContent = `${data.sent} sent · ${data.failed} failed · ${data.pending || 0} remaining`;
      panel.classList.add('show');
      if (['completed','partial','failed','cancelled'].includes(data.status)) {
        const title = document.getElementById('spp-title');
        if (title) title.textContent = data.status === 'completed' ? 'Send complete ✓' : `Send ${data.status}`;
        setTimeout(() => { panel.classList.remove('show'); this.render(); }, 3500);
      }
    });
  },

  updateChar() {
    const body = document.getElementById('msg-body')?.value || '';
    const info = smsInfo(body);
    const el = document.getElementById('char-info');
    if (el) {
      el.textContent = `${info.len} / ${info.limit} — ${info.parts} SMS part${info.parts > 1 ? 's' : ''}`;
      el.className = 'char-info' + (info.len > 160 ? ' warn' : '') + (info.remaining < 0 ? ' over' : '');
    }
    const partsEl = document.getElementById('sum-parts');
    if (partsEl) partsEl.textContent = info.parts;

    // Personalization indicator
    const personal = document.getElementById('sum-personal');
    const hasVars = /\{name\}|\{first\}|\{phone\}/i.test(body);
    if (personal) personal.innerHTML = hasVars
      ? `<span class="badge badge-green">Yes — per contact</span>`
      : `<span class="badge badge-gray">No</span>`;

    this.updateSummary();
  },

  addManualNumber() {
    const inp = document.getElementById('manual-number');
    const num = inp.value.trim();
    if (!num) return;
    if (this.recipients.find(r => r.value === num)) { toast('Already added'); return; }
    this.recipients.push({ type: 'number', value: num, label: num, count: 1 });
    inp.value = '';
    this.renderTags();
    this.updateSummary();
  },

  addGroup(name, count) {
    if (this.recipients.find(r => r.value === name && r.type === 'group')) { toast('Group already added'); return; }
    this.recipients.push({ type: 'group', value: name, label: `${name} (${count})`, count: parseInt(count) });
    this.renderTags();
    this.updateSummary();
  },

  removeRecipient(idx) {
    this.recipients.splice(idx, 1);
    this.renderTags();
    this.updateSummary();
  },

  renderTags() {
    const el = document.getElementById('recipient-tags');
    if (!el) return;
    el.innerHTML = this.recipients.length
      ? this.recipients.map((r, i) => `<span class="tag">${escHtml(r.label)}<span class="tag-remove" onclick="composePage.removeRecipient(${i})">×</span></span>`).join('')
      : '<span class="tag-placeholder">No recipients yet</span>';
  },

  updateSummary() {
    const total = this.recipients.reduce((s, r) => s + r.count, 0);
    const parts = parseInt(document.getElementById('sum-parts')?.textContent) || 1;
    if (document.getElementById('compose-total')) document.getElementById('compose-total').textContent = total * parts;
    if (document.getElementById('sum-recip'))    document.getElementById('sum-recip').textContent = total;
    if (document.getElementById('sum-total'))    document.getElementById('sum-total').textContent = total * parts;

    const typeEl = document.getElementById('sum-type');
    if (typeEl) {
      typeEl.innerHTML = this.isFlash()
        ? '<span class="badge badge-amber">⚡ Flash</span>'
        : '<span class="badge badge-gray">Normal</span>';
    }

    const devEl = document.getElementById('sum-device');
    if (devEl) {
      if (this.selectedDevice) {
        const cls = this.selectedDevice.type === 'android' ? 'badge-green' : 'badge-blue';
        devEl.innerHTML = `<span class="badge ${cls}">${escHtml(this.selectedDevice.label)}</span>`;
      } else {
        devEl.innerHTML = '<span class="badge badge-red">No device</span>';
      }
    }
  },

  toggleSchedule() {
    const show = document.getElementById('schedule-toggle').checked;
    document.getElementById('schedule-time').style.display = show ? 'block' : 'none';
  },

  clear() {
    this.recipients = [];
    if (document.getElementById('msg-body')) document.getElementById('msg-body').value = '';
    if (document.getElementById('manual-number')) document.getElementById('manual-number').value = '';
    if (document.getElementById('schedule-toggle')) document.getElementById('schedule-toggle').checked = false;
    const st = document.getElementById('schedule-time');
    if (st) { st.style.display = 'none'; st.value = ''; }
    const flashEl = document.getElementById('flash-sms');
    if (flashEl) flashEl.checked = Settings.get('default_sms_type') === 'flash';
    this.renderTags();
    this.toggleFlash();
    this.updateChar();
  },

  async sendTestSMS() {
    const body = document.getElementById('msg-body')?.value.trim();
    if (!body) { toast('Enter a message first', 'error'); return; }
    showModal(`
      <div class="modal-title">Send test SMS</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">
        Send a preview to one number to check formatting and delivery before your bulk send.
        Personalization will use "Test Contact" as the name.
      </p>
      <div class="form-group">
        <label class="form-label">Test phone number</label>
        <input class="form-input" id="test-phone" placeholder="+256700000000" type="tel">
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="composePage.confirmTestSMS()">Send test</button>
      </div>`);
  },

  async confirmTestSMS() {
    const phone = document.getElementById('test-phone')?.value.trim();
    const body  = document.getElementById('msg-body')?.value.trim();
    if (!phone) { toast('Enter a phone number', 'error'); return; }
    hideModal();
    const deviceInfo = this.selectedDevice ? { type: this.selectedDevice.type, androidDeviceId: this.selectedDevice.id } : { type: 'modem' };
    const r = await window.api.messages.sendSample({ phone, body, flash: this.isFlash(), deviceInfo });
    if (r.success) toast(`Test SMS sent to ${phone}`, 'success');
    else toast(r.error || 'Test send failed', 'error');
  },

  async send() {
    const body     = document.getElementById('msg-body')?.value.trim();
    const senderID = document.getElementById('sender-id')?.value.trim();
    const scheduled   = document.getElementById('schedule-toggle')?.checked;
    const scheduledAt = scheduled ? document.getElementById('schedule-time')?.value : null;

    if (!body)               { toast('Please enter a message', 'error'); return; }
    if (!this.recipients.length) { toast('Please add at least one recipient', 'error'); return; }

    // Pre-send validation check
    const check = await window.api.contacts.checkBeforeSend({ recipients: this.recipients });
    if (check.invalid.length > 0 || check.duplicates.length > 0) {
      const proceed = await new Promise(resolve => {
        const issues = [];
        if (check.invalid.length)    issues.push(`<div class="validation-banner error" style="margin-bottom:8px"><div class="validation-icon">⚠</div><div><div class="validation-title" style="color:var(--red-text)">${check.invalid.length} invalid phone number${check.invalid.length!==1?'s':''}</div><div class="validation-body" style="color:var(--red-text)">${check.invalid.slice(0,3).map(c=>`${escHtml(c.name)}: ${escHtml(c.phone)}`).join(' · ')}${check.invalid.length>3?' …':''}<br>These will fail — fix in Contacts first.</div></div></div>`);
        if (check.duplicates.length) issues.push(`<div class="validation-banner warning" style="margin-bottom:8px"><div class="validation-icon">⊙</div><div><div class="validation-title" style="color:var(--warn-text)">${check.duplicates.length} duplicate number${check.duplicates.length!==1?'s':''}</div><div class="validation-body" style="color:var(--warn-text)">Some contacts share phone numbers — they would receive multiple SMS.</div></div></div>`);
        showModal(`<div class="modal-title">Issues found before sending</div>${issues.join('')}
          <div class="modal-footer">
            <button class="btn btn-sm" data-cancel>Cancel & fix</button>
            <button class="btn btn-amber btn-sm" data-confirm>Send anyway (${check.valid} valid)</button>
          </div>`, () => resolve(true));
      });
      if (!proceed) return;
    }
    if (scheduled && !scheduledAt) { toast('Please set a schedule time', 'error'); return; }
    if (!this.selectedDevice && !scheduled) { toast('No sending device selected. Go to Devices page.', 'error'); return; }

    const total = this.recipients.reduce((s, r) => s + r.count, 0);
    const parts = smsInfo(body).parts;
    const hasVars = /\{name\}|\{first\}|\{phone\}/i.test(body);
    const isScheduled = scheduled && scheduledAt;
    const flash = this.isFlash();
    const deviceInfo = this.selectedDevice
      ? { type: this.selectedDevice.type, androidDeviceId: this.selectedDevice.id }
      : { type: 'modem' };

    const confirmed = await new Promise(resolve => {
      showModal(`
        <div class="modal-title">${isScheduled ? 'Schedule message?' : 'Send message now?'}</div>
        <div style="background:var(--bg-active);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--text-2);line-height:1.6">${escHtml(body.substring(0,120))}${body.length>120?'…':''}</div>
        <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:4px">
          <tr><td style="color:var(--text-2);padding:4px 0">Recipients</td><td style="text-align:right;font-weight:500">${total}</td></tr>
          <tr><td style="color:var(--text-2);padding:4px 0">SMS parts each</td><td style="text-align:right;font-weight:500">${parts}</td></tr>
          <tr><td style="color:var(--text-2);padding:4px 0">Total messages</td><td style="text-align:right;font-weight:500">${total * parts}</td></tr>
          <tr><td style="color:var(--text-2);padding:4px 0">Message type</td><td style="text-align:right"><span class="badge ${flash ? 'badge-amber' : 'badge-gray'}">${flash ? '⚡ Flash SMS' : 'Normal SMS'}</span></td></tr>
          <tr><td style="color:var(--text-2);padding:4px 0">Device</td><td style="text-align:right"><span class="badge ${deviceInfo.type==='android'?'badge-green':'badge-blue'}">${escHtml(this.selectedDevice?.label || 'GSM Modem')}</span></td></tr>
          ${hasVars ? `<tr><td style="color:var(--text-2);padding:4px 0">Personalized</td><td style="text-align:right"><span class="badge badge-green">Yes — per contact</span></td></tr>` : ''}
          ${isScheduled ? `<tr><td style="color:var(--text-2);padding:4px 0">Scheduled for</td><td style="text-align:right;font-weight:500">${new Date(scheduledAt).toLocaleString()}</td></tr>` : ''}
        </table>
        ${flash ? `<div class="validation-banner warning" style="margin-top:12px"><div class="validation-icon">⚡</div><div><div class="validation-title" style="color:var(--warn-text)">Flash SMS</div><div class="validation-body" style="color:var(--warn-text)">Each recipient will see this message full-screen and it will not be saved in their inbox.</div></div></div>` : ''}
        <div class="modal-footer">
          <button class="btn btn-sm" data-cancel>Cancel</button>
          <button class="btn btn-primary btn-sm" data-confirm>${isScheduled ? 'Schedule' : `Send ${total * parts} messages`}</button>
        </div>`, () => resolve(true));
    });

    if (!confirmed) return;

    const result = await window.api.messages.send({
      senderID, body, recipients: this.recipients,
      scheduledAt: isScheduled ? scheduledAt : null,
      deviceInfo, flash,
    });

    if (result.success) {
      toast(isScheduled ? `Scheduled for ${total} recipients` : `Sending to ${result.total} recipients...`, 'success');
      if (!isScheduled) document.getElementById('send-progress')?.classList.add('show');
      this.clear();
      if (isScheduled) pagesRouter.load('scheduled');
    } else {
      toast(result.error || 'Send failed', 'error');
    }
  }
};

  showImportMenu(btn) {
    const menu = document.getElementById('import-menu');
    if (!menu) return;

    menu.style.top = (r.bottom + 6) + 'px';

  },

  setFilter(f) {
    this.filter = f;
    ['all','invalid','duplicate'].forEach(x => {
      document.getElementById('fc-' + x)?.classList.toggle('active', x === f);
    });
    this.renderTable();
  },

  async load() {
    const search = document.getElementById('contact-search')?.value || '';
    const group  = document.getElementById('group-filter')?.value  || '';
    this.contacts = await window.api.contacts.list({ search, group });

    // Find duplicate phone numbers in current list
    const phoneCounts = {};
    this.contacts.forEach(c => { phoneCounts[c.phone] = (phoneCounts[c.phone]||0)+1; });
    this.duplicatePhones = new Set(Object.keys(phoneCounts).filter(p => phoneCounts[p] > 1));

    const invalidCount   = this.contacts.filter(c => !c.phone_valid).length;
    const duplicateCount = this.contacts.filter(c => this.duplicatePhones.has(c.phone)).length;

    const allEl = document.getElementById('fc-all-count');
    const invEl = document.getElementById('fc-invalid-count');
    const dupEl = document.getElementById('fc-dup-count');
    if (allEl) allEl.textContent = `(${this.contacts.length})`;
    if (invEl) invEl.textContent = invalidCount > 0 ? `(${invalidCount})` : '';
    if (dupEl) dupEl.textContent = duplicateCount > 0 ? `(${duplicateCount})` : '';

    // Show invalid chips prominently if any found
    const invChip = document.getElementById('fc-invalid');
    const dupChip = document.getElementById('fc-duplicate');
    if (invChip) invChip.style.display = invalidCount > 0 ? '' : 'none';
    if (dupChip) dupChip.style.display = duplicateCount > 0 ? '' : 'none';

    this.renderTable();
  },

  renderTable() {
    const tbody = document.getElementById('contacts-tbody');
    if (!tbody) return;

    let visible = this.contacts;
    if (this.filter === 'invalid')   visible = this.contacts.filter(c => !c.phone_valid);
    if (this.filter === 'duplicate') visible = this.contacts.filter(c => this.duplicatePhones.has(c.phone));

    if (!visible.length) {
      const msg = this.filter === 'invalid' ? 'No invalid contacts — all phone numbers look good ✓'
                : this.filter === 'duplicate' ? 'No duplicate phone numbers found ✓'
                : 'No contacts yet. Import from Excel, CSV, SIM or Android.';
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4.418 3.582-7 8-7s8 2.582 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p style="font-size:13px">${msg}</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = visible.map(c => {
      const isDupe    = this.duplicatePhones.has(c.phone);
      const isInvalid = !c.phone_valid;
      const rowClass  = isInvalid ? 'row-invalid' : isDupe ? 'row-duplicate' : '';
      const phoneClass= isInvalid ? 'phone-invalid' : isDupe ? 'phone-duplicate' : 'phone-valid';
      const phoneTip  = isInvalid ? 'Invalid phone number format'
                      : isDupe    ? 'Duplicate phone number — exists in multiple contacts' : '';
      const statusBadge = isInvalid
        ? `<span class="badge badge-red">⚠ Invalid</span>`
        : isDupe
        ? `<span class="badge badge-warn">⊙ Duplicate</span>`
        : c.active
        ? `<span class="badge badge-teal">Active</span>`
        : `<span class="badge badge-gray">Inactive</span>`;

      return `<tr class="${rowClass}">
        <td><input type="checkbox" class="contact-cb" value="${c.id}" onchange="contactsPage.updateBulkBar()"></td>
        <td style="font-weight:600;font-size:13px">${escHtml(c.name)}</td>
        <td><span class="${phoneClass}" title="${escHtml(phoneTip)}">${escHtml(c.phone)}</span>
          ${isInvalid ? `<button class="btn btn-xs" style="margin-left:6px" onclick="contactsPage.showFixPhone(${c.id},'${escHtml(c.phone)}')">Fix</button>` : ''}
          ${isDupe ? `<button class="btn btn-xs" style="margin-left:6px" onclick="contactsPage.showMergeDupe('${escHtml(c.phone)}')">View dupes</button>` : ''}
        </td>
        <td>${statusBadge}</td>
        <td><span class="badge badge-blue" style="font-size:10px">${escHtml(c.group_name)}</span></td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-xs" onclick="contactsPage.quickSend('${escHtml(c.phone)}','${escHtml(c.name)}')" title="Send SMS">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M13.5 2.5L7 9M13.5 2.5L9 13.5l-2-4.5-4.5-2 11-4.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn btn-xs" onclick="contactsPage.showEditModal(${c.id})">Edit</button>
          <button class="btn btn-xs btn-danger" onclick="contactsPage.deleteContact(${c.id},'${escHtml(c.name)}')">✕</button>
        </td>
      </tr>`;
    }).join('');
  },

  async runValidation() {
    const btn = event.currentTarget;
    btn.textContent = 'Validating…';
    btn.disabled = true;
    const r = await window.api.contacts.validatePhones();
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.8 3.6L14 5.5l-3 2.9.7 4.1L8 10.4l-3.7 2.1.7-4.1-3-2.9 4.2-.9z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg> Validate`;

    const el = document.getElementById('validation-result');
    if (!el) return;
    await this.load(); // Refresh with phone_valid flags

    const dupeCount = this.duplicatePhones.size;
    if (r.flagged === 0 && dupeCount === 0) {
      el.innerHTML = `<div class="validation-banner success">
        <div class="validation-icon">✓</div>
        <div><div class="validation-title" style="color:var(--green-text)">All contacts look good!</div>
        <div class="validation-body" style="color:var(--green-text)">${r.total} contacts validated — no invalid numbers or duplicates found.</div></div>
      </div>`;
      setTimeout(() => el.innerHTML = '', 4000);
      return;
    }

    let html = '';
    if (r.flagged > 0) {
      html += `<div class="validation-banner error">
        <div class="validation-icon">⚠</div>
        <div>
          <div class="validation-title" style="color:var(--red-text)">${r.flagged} invalid phone number${r.flagged !== 1 ? 's' : ''} found</div>
          <div class="validation-body" style="color:var(--red-text)">
            These numbers don't match international format (+countrycode). They will fail during sending.
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-sm" onclick="contactsPage.setFilter('invalid')">View invalid contacts</button>
            <button class="btn btn-danger btn-sm" onclick="contactsPage.deleteAllInvalid()">Delete all invalid</button>
          </div>
        </div>
      </div>`;
    }
    if (dupeCount > 0) {
      html += `<div class="validation-banner warning" style="margin-top:8px">
        <div class="validation-icon">⊙</div>
        <div>
          <div class="validation-title" style="color:var(--warn-text)">${dupeCount} duplicate phone number${dupeCount !== 1 ? 's' : ''} detected</div>
          <div class="validation-body" style="color:var(--warn-text)">Multiple contacts share the same number — they'll receive duplicate messages.</div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-sm" onclick="contactsPage.setFilter('duplicate')">View duplicates</button>
            <button class="btn btn-sm" onclick="contactsPage.removeAllDuplicates()">Auto-remove duplicates</button>
          </div>
        </div>
      </div>`;
    }
    el.innerHTML = html;
  },

  async deleteAllInvalid() {
    showModal(`<div class="modal-title">Delete all invalid contacts?</div>
      <p style="font-size:13px;color:var(--text-2)">All contacts with invalid phone numbers will be permanently deleted.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-danger btn-sm" data-confirm>Delete invalid</button></div>`,
      async () => {
        const r = await window.api.contacts.deleteInvalid();
        toast(`Deleted ${r.deleted} invalid contacts`, 'success');
        document.getElementById('validation-result').innerHTML = '';
        this.load();
      });

  async removeAllDuplicates() {
    showModal(`<div class="modal-title">Remove duplicate contacts?</div>
      <p style="font-size:13px;color:var(--text-2)">For each duplicate phone number, the oldest entry will be kept and extras removed.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-amber btn-sm" data-confirm>Remove duplicates</button></div>`,
      async () => {
        const r = await window.api.contacts.removeDuplicates();
        toast(`Removed ${r.removed} duplicate contacts`, 'success');
        document.getElementById('validation-result').innerHTML = '';
        this.load();
      });
  },

  showFixPhone(id, phone) {
    showModal(`<div class="modal-title">Fix phone number</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">Current: <code style="background:var(--red-bg);padding:2px 8px;border-radius:4px;color:var(--red-text)">${escHtml(phone)}</code></p>

        <label class="form-label">Corrected number</label>
        <input class="form-input" id="m-fix-phone" value="${escHtml(phone)}" placeholder="+256700000000">
        <div style="font-size:11px;color:var(--text-3);margin-top:4px">Include country code, e.g. +256700123456</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="contactsPage.applyFixPhone(${id})">Save & validate</button>
      </div>`);
  },

  async applyFixPhone(id) {
    const phone = document.getElementById('m-fix-phone')?.value.trim();
    if (!phone) return;
    const r = await window.api.contacts.fixPhone({ id, phone });
    if (r.success) { hideModal(); toast(`Fixed: ${r.fixed}`, 'success'); this.load(); }
    else toast(r.error || 'Fix failed', 'error');
  },

  showMergeDupe(phone) {
    const dupes = this.contacts.filter(c => c.phone === phone);
    showModal(`<div class="modal-title">Duplicate contacts for ${escHtml(phone)}</div>
      <div style="margin-bottom:14px">
        ${dupes.map(c => `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">
          <div><div style="font-weight:600">${escHtml(c.name)}</div><div style="font-size:11px;color:var(--text-3)">${escHtml(c.group_name)} · ID ${c.id}</div></div>
          <button class="btn btn-danger btn-xs" onclick="contactsPage._deleteSingleDupe(${c.id})">Delete</button>
        </div>`).join('')}
      </div>
      <p style="font-size:12px;color:var(--text-3)">Delete all but one to resolve this duplicate.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Close</button></div>`);
  },

  async _deleteSingleDupe(id) {
    await window.api.contacts.delete({ id });
    toast('Contact deleted');
    hideModal();
    this.load();
  },

  // ── Bulk actions ──────────────────────────────────────────────────────────
  toggleSelectAll(cb) {
    document.querySelectorAll('.contact-cb').forEach(c => c.checked = cb.checked);
    this.updateBulkBar();
  },
  updateBulkBar() {
    const sel = document.querySelectorAll('.contact-cb:checked');
    const bar = document.getElementById('bulk-bar');
    const el  = document.getElementById('selected-count');
    if (sel.length > 0) {
      bar.style.display = 'flex';
      el.textContent = `${sel.length} contact${sel.length !== 1 ? 's' : ''} selected`;
    } else {
      bar.style.display = 'none';
    }
  },
  getSelectedIds() { return [...document.querySelectorAll('.contact-cb:checked')].map(c => parseInt(c.value)); },

  async bulkDelete() {
    const ids = this.getSelectedIds();
    if (!ids.length) return;
    showModal(`<div class="modal-title">Delete ${ids.length} contacts?</div>
      <p style="font-size:13px;color:var(--text-2)">This cannot be undone.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-danger btn-sm" data-confirm>Delete</button></div>`,
      async () => { for (const id of ids) await window.api.contacts.delete({ id }); toast(`${ids.length} deleted`); this.load(); });
  },

  async bulkActivate(active) {
    const ids = this.getSelectedIds();
    if (!ids.length) return;
    const all = await window.api.contacts.list({});
    for (const id of ids) {
      const c = all.find(x => x.id === id);
      if (c) await window.api.contacts.update({ ...c, active });
    }
    toast(`${ids.length} contacts ${active ? 'activated' : 'deactivated'}`, 'success');
    this.load();
  },

  async bulkMoveGroup() {
    const ids = this.getSelectedIds();
    if (!ids.length) return;
    const groups = await window.api.groups.list();
    showModal(`<div class="modal-title">Move ${ids.length} contacts to group</div>
      <div class="form-group"><label class="form-label">Group</label>
        <select class="form-input" id="m-bulk-group">${groups.map(g=>`<option>${escHtml(g.name)}</option>`).join('')}</select>
      </div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" data-confirm>Move</button></div>`,
      async () => {
        const group = document.getElementById('m-bulk-group').value;
        const all   = await window.api.contacts.list({});
        for (const id of ids) { const c = all.find(x=>x.id===id); if(c) await window.api.contacts.update({...c,group_name:group}); }
        toast(`Moved to ${group}`, 'success'); this.load();
      });
  },

  // ── Import methods ────────────────────────────────────────────────────────
  async importExcel() {
    const r = await window.api.contacts.importExcel({});
    if (r.canceled) return;
    if (r.success) {
      toast(`Imported ${r.added} contacts (${r.skipped} duplicates, ${r.invalid||0} invalid numbers)`, 'success');
      this.load(); return;
    }
    if (r.needsMapping) { this.showColumnMapper(r.columns, r.sampleRows); return; }
    toast(r.error || 'Import failed', 'error');
  },

  showColumnMapper(columns, sampleRows) {
    const opts  = columns.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
    const rows  = (sampleRows||[]).map(row => `<tr>${columns.map(c=>`<td style="padding:4px 8px;font-size:11px;border-bottom:1px solid var(--border);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(String(row[c]||''))}</td>`).join('')}</tr>`).join('');
    showModal(`<div class="modal-title">Map Excel columns</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">Couldn't auto-detect phone column. Please assign columns:</p>
      <div class="form-row form-row-3" style="margin-bottom:12px">
        <div class="form-group"><label class="form-label">Phone <span style="color:var(--red)">*</span></label>
          <select class="form-input" id="m-col-phone"><option value="">-- select --</option>${opts}</select></div>
        <div class="form-group"><label class="form-label">Name</label>
          <select class="form-input" id="m-col-name"><option value="">-- none --</option>${opts}</select></div>
        <div class="form-group"><label class="form-label">Group</label>
          <select class="form-input" id="m-col-group"><option value="">-- none --</option>${opts}</select></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em">Data preview</div>
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:4px">
        <table style="border-collapse:collapse;width:100%">
          <thead><tr>${columns.map(c=>`<th style="padding:5px 8px;font-size:10px;text-transform:uppercase;color:var(--teal);border-bottom:2px solid var(--teal-light);white-space:nowrap;background:var(--teal-pale)">${escHtml(c)}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" onclick="contactsPage.confirmColumnMap()">Import</button></div>`);
  },

  async confirmColumnMap() {
    const phoneCol = document.getElementById('m-col-phone')?.value;
    if (!phoneCol) { toast('Phone column required', 'error'); return; }
    const columnMap = { phone: phoneCol, name: document.getElementById('m-col-name')?.value||null, group: document.getElementById('m-col-group')?.value||null };
    hideModal();
    const r = await window.api.contacts.importExcel({ columnMap });
    if (r.success) { toast(`Imported ${r.added} contacts (${r.skipped} dupes, ${r.invalid||0} invalid)`, 'success'); this.load(); }
    else toast(r.error||'Import failed','error');
  },

  async importCSV() {
    const r = await window.api.contacts.importCSV();
    if (r.canceled) return;
    if (r.success) { toast(`Imported ${r.added} contacts (${r.skipped} duplicates)`, 'success'); this.load(); }
    else toast(r.error||'Import failed','error');
  },

  async importFromSIM() {
    if (!modem.connected) { toast('Connect a GSM modem first', 'error'); return; }
    toast('Reading SIM contacts…');
    const r = await window.api.modem.readSimContacts();
    if (!r.success) { toast(r.error||'SIM read failed','error'); return; }
    if (!r.contacts.length) { toast('No contacts found on SIM'); return; }
    showModal(`<div class="modal-title">Import ${r.contacts.length} SIM contacts</div>
      <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px">
        ${r.contacts.slice(0,40).map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--border);font-size:12px"><span>${escHtml(c.name)}</span><span style="font-family:var(--mono);color:var(--text-3)">${escHtml(c.phone)}</span></div>`).join('')}
        ${r.contacts.length>40?`<div style="padding:6px 12px;font-size:11px;color:var(--text-3)">…and ${r.contacts.length-40} more</div>`:''}
      </div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" data-confirm>Import all</button></div>`,
      async () => { const ir=await window.api.contacts.importSim(r.contacts); toast(`Imported ${ir.added} (${ir.skipped} dupes)`,'success'); this.load(); });
  },

  async importFromAndroid() {
    const s = await window.api.android.adbStatus();
    if (!s.available) { showModal(`<div class="modal-title">ADB required</div><p style="font-size:13px;color:var(--text-2);margin-bottom:8px">Install Android platform-tools and enable USB Debugging on your phone.</p><div class="modal-footer"><button class="btn btn-primary btn-sm" data-cancel>OK</button></div>`); return; }
    toast('Scanning for Android devices…');
    const dr = await window.api.android.devices();
    if (!dr.success||!dr.devices.length) { toast('No Android device found. Enable USB Debugging and connect via USB.','error'); return; }
    const d = dr.devices[0];
    showModal(`<div class="modal-title">Android device connected</div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--teal-pale);border-radius:var(--radius);margin-bottom:14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="3" stroke="var(--teal)" stroke-width="1.5"/><circle cx="12" cy="18" r="1" fill="var(--teal)"/></svg>
        <div><div style="font-size:14px;font-weight:700;color:var(--teal-dark)">${escHtml(d.model)}</div><div style="font-size:11px;color:var(--text-3)">${escHtml(d.id)}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" onclick="contactsPage._androidImportContacts('${escHtml(d.id)}')">Import phone contacts</button>
        <button class="btn" onclick="contactsPage._androidImportSMS('${escHtml(d.id)}')">Import SMS inbox</button>
      </div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button></div>`);
  },

  async _androidImportContacts(id) { hideModal(); toast('Reading contacts…'); const r=await window.api.android.importContacts({deviceId:id}); if(r.success){toast(`Imported ${r.added} (${r.skipped} dupes)`,'success');this.load();}else toast(r.error||'Failed','error'); },
  async _androidImportSMS(id) { hideModal(); toast('Reading SMS…'); const r=await window.api.android.importSMS({deviceId:id}); if(r.success){toast(`Imported ${r.added} messages`,'success');pagesRouter.load('inbox');}else toast(r.error||'Failed','error'); },

  // ── Add / Edit / Delete ───────────────────────────────────────────────────
  showAddModal() {
    showModal(`<div class="modal-title">Add contact</div>
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="m-name" placeholder="Full name"></div>
      <div class="form-group"><label class="form-label">Phone <span style="color:var(--red)">*</span></label><input class="form-input" id="m-phone" placeholder="+256700000000" type="tel"></div>
      <div class="form-group"><label class="form-label">Group</label>
        <select class="form-input" id="m-group">${this.groups.map(g=>`<option>${escHtml(g.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="m-notes" style="min-height:55px"></textarea></div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" onclick="contactsPage.saveAdd()">Add</button></div>`);
  },

  async saveAdd() {
    const name=document.getElementById('m-name').value.trim(), phone=document.getElementById('m-phone').value.trim();
    if (!phone){toast('Phone is required','error');return;}
    const r=await window.api.contacts.add({name:name||phone,phone,group_name:document.getElementById('m-group').value,notes:document.getElementById('m-notes').value.trim()});
    if(r.success){hideModal();toast('Contact added','success');this.load();}else toast(r.error||'Failed','error');
  },

  showEditModal(id) {
    const c=this.contacts.find(x=>x.id===id);if(!c)return;
    showModal(`<div class="modal-title">Edit contact</div>
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="m-name" value="${escHtml(c.name)}"></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="m-phone" value="${escHtml(c.phone)}"></div>
      <div class="form-group"><label class="form-label">Group</label>
        <select class="form-input" id="m-group">${this.groups.map(g=>`<option ${g.name===c.group_name?'selected':''}>${escHtml(g.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="m-notes" style="min-height:55px">${escHtml(c.notes||'')}</textarea></div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="m-active" ${c.active?'checked':''}><label for="m-active" style="font-size:13px;cursor:pointer">Active</label></div>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-primary btn-sm" onclick="contactsPage.saveEdit(${id})">Save</button></div>`);
  },

  async saveEdit(id) {
    const r=await window.api.contacts.update({id,name:document.getElementById('m-name').value.trim(),phone:document.getElementById('m-phone').value.trim(),group_name:document.getElementById('m-group').value,notes:document.getElementById('m-notes').value.trim(),active:document.getElementById('m-active').checked});
    if(r.success){hideModal();toast('Updated','success');this.load();}else toast('Failed','error');
  },

  deleteContact(id,name) {
    showModal(`<div class="modal-title">Delete contact</div><p style="font-size:13px;color:var(--text-2)">Delete <strong>${escHtml(name)}</strong>?</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-danger btn-sm" data-confirm>Delete</button></div>`,
      async()=>{await window.api.contacts.delete({id});toast('Deleted');this.load();});
  },

  quickSend(phone,name) {
    composePage.recipients.push({type:'number',value:phone,label:`${name} (${phone})`,count:1});
    pagesRouter.load('compose');
    toast(`Added ${name} to recipients`,'success');
  },

  async exportCSV() {
    const all=await window.api.contacts.list({});
    const r=await window.api.contacts.exportCSV(all);
    if(r.success) toast('Contacts exported','success');
  }
};

// ── Page: inbox ──────────────────────────────────────────
const inboxPage = {
  messages: [],
  selected: null,

  async render() {
    document.getElementById('page-inbox').innerHTML = `
      <div class="page-header">
        <div class="page-title">Inbox</div>
        <div class="header-actions">
          <button class="btn btn-sm" onclick="inboxPage.importFromModem()">Read from modem</button>
          <button class="btn btn-sm" onclick="inboxPage.markAllRead()">Mark all read</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:320px 1fr;flex:1;overflow:hidden">
        <div style="border-right:1px solid var(--border);overflow-y:auto;background:var(--bg-panel)" id="inbox-list"></div>
        <div style="overflow-y:auto;padding:24px" id="inbox-detail">
          <div class="empty-state" style="height:100%">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v9a2 2 0 01-2 2H5a2 2 0 01-2-2v-9z" stroke="currentColor" stroke-width="1.5"/><path d="M9 21V12h6v9" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <p>Select a message to read</p>
          </div>
        </div>
      </div>`;
    // Listen for new incoming SMS
    window.api.inbox.onNew(() => this.load());
    await this.load();
  },

  async load() {
    this.messages = await window.api.inbox.list({ limit: 200 });
    const unread = this.messages.filter(m => !m.read_flag).length;
    setNavBadge('inbox', unread);
    this.renderList();
  },

  renderList() {
    const el = document.getElementById('inbox-list');
    if (!el) return;
    if (!this.messages.length) {
      el.innerHTML = `<div class="empty-state" style="padding:40px 16px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v9a2 2 0 01-2 2H5a2 2 0 01-2-2v-9z" stroke="currentColor" stroke-width="1.5"/></svg>
        <p>No messages</p><small>Received SMS will appear here</small></div>`;
      return;
    }
    el.innerHTML = this.messages.map(m => {
      const initials = (m.contact_name || m.phone).substring(0, 2).toUpperCase();
      return `<div class="inbox-item ${!m.read_flag ? 'unread' : ''} ${this.selected === m.id ? 'active' : ''}" onclick="inboxPage.select(${m.id})">
        ${!m.read_flag ? '<div class="unread-dot"></div>' : '<div style="width:7px;flex-shrink:0"></div>'}
        <div class="inbox-avatar">${escHtml(initials)}</div>
        <div class="inbox-body">
          <div class="inbox-from">${escHtml(m.contact_name || m.phone)}</div>
          <div class="inbox-preview">${escHtml(m.body)}</div>
        </div>
        <div class="inbox-time">${formatDate(m.received_at)}</div>
      </div>`;
    }).join('');
  },

  async select(id) {
    this.selected = id;
    const msg = this.messages.find(m => m.id === id);
    if (!msg) return;
    if (!msg.read_flag) {
      await window.api.inbox.markRead({ id });
      msg.read_flag = 1;
      this.renderList();
    }
    const unread = this.messages.filter(m => !m.read_flag).length;
    setNavBadge('inbox', unread);

    const detail = document.getElementById('inbox-detail');
    if (!detail) return;
    detail.innerHTML = `
      <div style="max-width:600px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="inbox-avatar" style="width:44px;height:44px;font-size:16px">${escHtml((msg.contact_name || msg.phone).substring(0,2).toUpperCase())}</div>
            <div>
              <div style="font-size:15px;font-weight:600">${escHtml(msg.contact_name || 'Unknown')}</div>
              <div style="font-size:12px;color:var(--text-2);font-family:var(--mono)">${escHtml(msg.phone)}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm" onclick="inboxPage.reply('${escHtml(msg.phone)}','${escHtml(msg.contact_name || msg.phone)}')">Reply SMS</button>
            <button class="btn btn-sm btn-danger" onclick="inboxPage.deleteMsg(${msg.id})">Delete</button>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-3);margin-bottom:10px">${new Date(msg.received_at).toLocaleString()}</div>
        <div style="background:var(--bg-secondary, var(--bg-active));border-radius:var(--radius-lg);padding:16px 18px;font-size:14px;line-height:1.7;color:var(--text)">${escHtml(msg.body)}</div>
      </div>`;
  },

  reply(phone, name) {
    composePage.recipients.push({ type: 'number', value: phone, label: `${name} (${phone})`, count: 1 });
    pagesRouter.load('compose');
    toast(`Replying to ${name}`, 'success');
  },

  async deleteMsg(id) {
    await window.api.inbox.delete({ id });
    this.selected = null;
    document.getElementById('inbox-detail').innerHTML = '<div class="empty-state"><p>Select a message</p></div>';
    this.load();
    toast('Message deleted');
  },

  async markAllRead() {
    await window.api.inbox.markAllRead();
    this.load();
    toast('All messages marked as read');
  },

  async importFromModem() {
    const r = await window.api.inbox.importFromModem();
    if (r.success) { toast(`Imported ${r.added} messages from modem`, 'success'); this.load(); }
    else toast(r.error || 'Import failed', 'error');
  }
};

// ── Page: templates ──────────────────────────────────────────
const templatesPage = {
  templates: [],

  async render() {
    document.getElementById('page-templates').innerHTML = `
      <div class="page-header">
        <div class="page-title">Message Templates</div>
        <div class="header-actions">
          <button class="btn btn-primary btn-sm" onclick="templatesPage.showAddModal()">+ New template</button>
        </div>
      </div>
      <div class="page-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:16px">
          Use <code style="background:var(--bg-active);padding:1px 5px;border-radius:4px;font-family:var(--mono)">{variable}</code> placeholders — they're highlighted when you use a template in Compose.
        </p>
        <div class="template-grid" id="template-grid"></div>
      </div>`;
    this.load();
  },

  async load() {
    this.templates = await window.api.templates.list();
    this.renderGrid();
  },

  renderGrid() {
    const el = document.getElementById('template-grid');
    if (!el) return;
    if (!this.templates.length) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No templates yet</p><small>Create reusable message templates</small></div>`;
      return;
    }
    // Group by category
    const cats = {};
    this.templates.forEach(t => { if (!cats[t.category]) cats[t.category] = []; cats[t.category].push(t); });
    el.innerHTML = Object.entries(cats).map(([cat, tmpls]) => `
      <div style="grid-column:1/-1;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px">${escHtml(cat)}</div>
      ${tmpls.map(t => {
        const vars = [...new Set(t.body.match(/\{[^}]+\}/g) || [])];
        return `<div class="template-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div class="template-card-name">${escHtml(t.name)}</div>
            <span class="template-card-use">Used ${t.use_count}×</span>
          </div>
          <div class="template-card-body">${escHtml(t.body)}</div>
          ${vars.length ? `<div class="template-vars">${vars.map(v => `<span class="var-pill">${escHtml(v)}</span>`).join('')}</div>` : ''}
          <div class="template-card-actions">
            <button class="btn btn-primary btn-sm" onclick="templatesPage.use(${t.id})">Use in Compose</button>
            <button class="btn btn-sm" onclick="templatesPage.showEditModal(${t.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="templatesPage.deleteTemplate(${t.id},'${escHtml(t.name)}')">Delete</button>
          </div>
        </div>`;
      }).join('')}`
    ).join('');
  },

  showAddModal() {
    showModal(`
      <div class="modal-title">New template</div>
      <div class="form-group"><label class="form-label">Template name</label><input class="form-input" id="m-tname" placeholder="e.g. Payment reminder"></div>
      <div class="form-group"><label class="form-label">Category</label><input class="form-input" id="m-tcat" placeholder="e.g. Finance" value="General"></div>
      <div class="form-group">
        <label class="form-label">Message body</label>
        <textarea class="form-input" id="m-tbody" placeholder="Use {name}, {date} etc. as placeholders" style="min-height:100px"></textarea>
        <div style="font-size:11px;color:var(--text-3);margin-top:4px">Variables detected: <span id="m-vars">none</span></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="templatesPage.saveAdd()">Save template</button>
      </div>`);
    document.getElementById('m-tbody').addEventListener('input', () => {
      const vars = [...new Set(document.getElementById('m-tbody').value.match(/\{[^}]+\}/g)||[])];
      document.getElementById('m-vars').textContent = vars.length ? vars.join(', ') : 'none';
    });
  },

  async saveAdd() {
    const name = document.getElementById('m-tname').value.trim();
    const body = document.getElementById('m-tbody').value.trim();
    const category = document.getElementById('m-tcat').value.trim() || 'General';
    if (!name || !body) { toast('Name and body required', 'error'); return; }
    const r = await window.api.templates.add({ name, body, category });
    if (r.success) { hideModal(); toast('Template saved', 'success'); this.load(); }
    else toast(r.error || 'Failed', 'error');
  },

  showEditModal(id) {
    const t = this.templates.find(x => x.id === id);
    if (!t) return;
    showModal(`
      <div class="modal-title">Edit template</div>
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="m-tname" value="${escHtml(t.name)}"></div>
      <div class="form-group"><label class="form-label">Category</label><input class="form-input" id="m-tcat" value="${escHtml(t.category)}"></div>
      <div class="form-group"><label class="form-label">Body</label><textarea class="form-input" id="m-tbody" style="min-height:100px">${escHtml(t.body)}</textarea></div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="templatesPage.saveEdit(${id})">Save</button>
      </div>`);
  },

  async saveEdit(id) {
    const r = await window.api.templates.update({ id, name: document.getElementById('m-tname').value.trim(), body: document.getElementById('m-tbody').value.trim(), category: document.getElementById('m-tcat').value.trim() || 'General' });
    if (r.success) { hideModal(); toast('Template updated', 'success'); this.load(); }
    else toast('Update failed', 'error');
  },

  async use(id) {
    const t = this.templates.find(x => x.id === id);
    if (!t) return;
    await window.api.templates.use({ id });
    pagesRouter.load('compose');
    // Wait for compose to render, then fill in body
    setTimeout(() => {
      const ta = document.getElementById('msg-body');
      if (ta) { ta.value = t.body; composePage.updateChar(); toast(`Template "${t.name}" loaded`, 'success'); }
    }, 100);
  },

  deleteTemplate(id, name) {
    showModal(`<div class="modal-title">Delete template</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:8px">Delete <strong>${escHtml(name)}</strong>?</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-danger btn-sm" data-confirm>Delete</button></div>`,
      async () => { await window.api.templates.delete({ id }); toast('Template deleted'); this.load(); });
  }
};

    const r = await window.api.groups.add({ name, description });
    if (r.success) { hideModal(); toast('Group created', 'success'); this.load(); }
