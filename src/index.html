// ── Page: logs ──────────────────────────────────────────
const logsPage = {
  messages: [],

  async render() {
    const stats = await window.api.messages.statsToday();
    document.getElementById('page-logs').innerHTML = `
      <div class="page-header">
        <div class="page-title">Message Logs</div>
        <div class="header-actions">
          <button class="btn btn-sm" onclick="logsPage.exportAll()">Export CSV</button>
          <button class="btn btn-sm" onclick="logsPage.load()">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 1011.31-2.5M2 2v4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Refresh
          </button>
        </div>
      </div>
      <div class="page-body">
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-val teal">${stats?.sent || 0}</div><div class="stat-lbl">Sent today</div></div>
          <div class="stat-card"><div class="stat-val red">${stats?.failed || 0}</div><div class="stat-lbl">Failed today</div></div>
          <div class="stat-card"><div class="stat-val amber">${stats?.pending || 0}</div><div class="stat-lbl">Pending</div></div>
        </div>
        <div class="card"><div class="card-body" id="logs-list">
          <div style="text-align:center;color:var(--text-3);padding:28px">Loading…</div>
        </div></div>
      </div>`;
    window.api.messages.onProgress(() => setTimeout(() => this.load(), 500));
    this.load();
  },

  async load() {
    this.messages = await window.api.messages.list({ limit: 150 });
    const el = document.getElementById('logs-list');
    if (!el) return;

    const failedCount = this.messages.filter(m => m.failed_count > 0 && m.status !== 'completed').length;
    setNavBadge('logs', failedCount);

    if (!this.messages.length) {
      el.innerHTML = `<div class="empty-state">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M7 8h10M7 12h10M7 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p>No messages yet</p><small>Sent messages will appear here</small></div>`;
      return;
    }

    el.innerHTML = this.messages.map(m => {
      const statusClass = { completed:'sent', failed:'failed', sending:'pending', partial:'pending', cancelled:'failed' }[m.status] || 'pending';
      const badgeClass  = { completed:'badge-teal', failed:'badge-red', partial:'badge-warn', cancelled:'badge-red' }[m.status] || 'badge-amber';
      const recips = JSON.parse(m.recipients_json || '[]');
      const recipLabel = recips.map(r => r.label || r.value).join(', ');
      const total = m.total_recipients || 1;
      const pct = Math.round((m.sent_count / total) * 100);
      const canRetry = m.failed_count > 0 && m.status !== 'sending';

      // Delivery rate mini-ring
      const ringRadius = 18, ringCirc = 2 * Math.PI * ringRadius;
      const ringDash = ((m.status === 'completed' || m.status === 'partial')
        ? Math.round((m.sent_count / total) * ringCirc) : 0);
      const ringColor = m.status === 'completed' ? 'var(--teal)' : m.status === 'partial' ? 'var(--amber)' : 'var(--red)';

      return `<div class="log-item">
        <div class="log-dot ${statusClass}"></div>
        <div class="log-body" style="flex:1;min-width:0">
          <div class="log-to">${escHtml(recipLabel.substring(0,55))}${recipLabel.length>55?'…':''}</div>
          <div class="log-msg">${escHtml(m.body)}</div>
          ${m.status==='sending'?`<div class="progress-wrap" style="margin-top:5px;max-width:280px"><div class="progress-bar" style="width:${pct}%"></div></div>`:''}
        </div>
        ${(m.status==='completed'||m.status==='partial'||m.status==='failed') ? `
        <div class="delivery-ring" style="width:48px;height:48px;flex-shrink:0" title="Delivery rate: ${pct}%">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="${ringRadius}" fill="none" stroke="var(--bg-active)" stroke-width="4"/>
            <circle cx="24" cy="24" r="${ringRadius}" fill="none" stroke="${ringColor}" stroke-width="4"
              stroke-dasharray="${ringDash} ${ringCirc}" stroke-linecap="round" transform="rotate(-90 24 24)"/>
          </svg>
          <div class="delivery-ring-label" style="font-size:10px;font-weight:700;color:${ringColor}">${pct}%</div>
        </div>` : ''}
        <div class="log-right">
          ${m.is_flash ? '<span class="badge badge-amber" title="Flash SMS (class 0)">⚡ Flash</span>' : ''}
          <span class="badge ${badgeClass}">${m.status==='completed'?`${m.sent_count}/${total}`:m.status==='partial'?`${m.sent_count}/${total}`:m.status}</span>
          <span class="log-time">${formatDate(m.created_at)}</span>
          <div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;justify-content:flex-end">
            <button class="btn btn-xs" onclick="logsPage.viewDelivery(${m.id})">Report</button>
            ${canRetry?`<button class="btn btn-xs" style="color:var(--amber-dark);border-color:var(--amber-light)" onclick="logsPage.retryFailed(${m.id})">Retry ${m.failed_count}</button>`:''}
            <button class="btn btn-xs btn-danger" onclick="logsPage.deleteMessage(${m.id})">✕</button>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  async viewDelivery(messageId) {
    const r = await window.api.messages.deliveryReport({ messageId });
    const { msg, logs, byStatus, deliveryRate } = r;
    if (!msg) return;

    const sent    = byStatus.sent    || 0;
    const failed  = byStatus.failed  || 0;
    const pending = byStatus.pending || 0;
    const total   = msg.total_recipients || logs.length;

    // Big ring
    const radius = 32, circ = 2 * Math.PI * radius;
    const sentDash   = Math.round((sent   / total) * circ);
    const failedDash = Math.round((failed / total) * circ);
    const sentOffset = 0;
    const failOffset = -sentDash;

    // Group logs by status for sorted display
    const sentLogs    = logs.filter(l=>l.status==='sent');
    const failedLogs  = logs.filter(l=>l.status==='failed');
    const pendingLogs = logs.filter(l=>l.status==='pending');

    showModal(`
      <div class="modal-title">Delivery report</div>

      <!-- Summary ring + stats -->
      <div style="display:flex;align-items:center;gap:20px;padding:16px;background:var(--teal-pale);border-radius:var(--radius-lg);margin-bottom:16px">
        <div style="position:relative;width:90px;height:90px;flex-shrink:0">
          <svg width="90" height="90" viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="${radius}" fill="none" stroke="var(--bg-active)" stroke-width="7"/>
            <circle cx="45" cy="45" r="${radius}" fill="none" stroke="var(--teal)" stroke-width="7"
              stroke-dasharray="${sentDash} ${circ}" stroke-linecap="round" transform="rotate(-90 45 45)"/>
            <circle cx="45" cy="45" r="${radius}" fill="none" stroke="var(--red)" stroke-width="7"
              stroke-dasharray="${failedDash} ${circ}" stroke-linecap="round"
              transform="rotate(${(-90 + (sentDash / circ) * 360)} 45 45)"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column">
            <div style="font-size:20px;font-weight:800;color:var(--teal-dark);line-height:1">${deliveryRate}%</div>
            <div style="font-size:10px;color:var(--text-3);font-weight:600">DELIVERED</div>
          </div>
        </div>
        <div style="flex:1">
          <div style="font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:500">${msg.is_flash ? '<span class="badge badge-amber" style="margin-right:6px">⚡ Flash</span>' : ''}${escHtml(msg.body.substring(0,80))}${msg.body.length>80?'…':''}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <div style="text-align:center;padding:8px;background:#fff;border-radius:var(--radius);border:1px solid var(--teal-light)">
              <div style="font-size:18px;font-weight:800;color:var(--teal)">${sent}</div>
              <div style="font-size:10px;color:var(--text-3);font-weight:600">SENT</div>
            </div>
            <div style="text-align:center;padding:8px;background:#fff;border-radius:var(--radius);border:1px solid #FFCDD2">
              <div style="font-size:18px;font-weight:800;color:var(--red)">${failed}</div>
              <div style="font-size:10px;color:var(--text-3);font-weight:600">FAILED</div>
            </div>
            <div style="text-align:center;padding:8px;background:#fff;border-radius:var(--radius);border:1px solid var(--amber-light)">
              <div style="font-size:18px;font-weight:800;color:var(--amber-dark)">${pending}</div>
              <div style="font-size:10px;color:var(--text-3);font-weight:600">PENDING</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Per-recipient list -->
      <div style="max-height:300px;overflow-y:auto;border:1.5px solid var(--border);border-radius:var(--radius-lg)">
        ${[...failedLogs, ...pendingLogs, ...sentLogs].map(l => `
          <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px">
            <div class="log-dot ${l.status==='sent'?'sent':l.status==='failed'?'failed':'pending'}" style="flex-shrink:0"></div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;color:var(--text)">${escHtml(l.contact_name || l.phone)}</div>
              <div style="font-size:11px;color:var(--text-3);font-family:var(--mono)">${escHtml(l.phone)}</div>
              ${l.error_text?`<div style="font-size:11px;color:var(--red-text);margin-top:2px">${escHtml(l.error_text)}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              <span class="badge ${l.status==='sent'?'badge-teal':l.status==='failed'?'badge-red':'badge-amber'}">${l.status}</span>
              <div style="font-size:10px;color:var(--text-3);margin-top:3px">${formatDate(l.sent_at)}</div>
            </div>
          </div>`).join('')}
      </div>

      <div class="modal-footer">
        <button class="btn btn-sm" onclick="logsPage.exportDetail(${messageId})">Export CSV</button>
        ${failed > 0 ? `<button class="btn btn-sm" style="color:var(--amber-dark);border-color:var(--amber-light)" onclick="logsPage.retryFailed(${messageId});hideModal()">Retry ${failed} failed</button>` : ''}
        <button class="btn btn-sm" data-cancel>Close</button>
      </div>`);
  },

  async retryFailed(messageId) {
    if (!modem.connected) { toast('Modem not connected', 'error'); return; }
    const r = await window.api.messages.retryFailed({ messageId });
    if (r.success) { toast(`Retrying ${r.retrying} failed messages`, 'success'); this.load(); }
    else toast(r.error || 'Nothing to retry', 'error');
  },

  deleteMessage(messageId) {
    showModal(`<div class="modal-title">Delete log entry?</div>
      <p style="font-size:13px;color:var(--text-2)">Removes this message and all delivery records. Cannot be undone.</p>
      <div class="modal-footer"><button class="btn btn-sm" data-cancel>Cancel</button><button class="btn btn-danger btn-sm" data-confirm>Delete</button></div>`,
      async () => { await window.api.messages.delete({ messageId }); toast('Deleted'); this.load(); });
  },

  async exportDetail(messageId) {
    const logs = await window.api.messages.logs({ messageId });
    const r = await window.api.messages.exportLogs(logs);
    if (r.success) toast('Report exported', 'success');
  },

  async exportAll() {
    const allLogs = [];
    for (const m of this.messages) {
      const logs = await window.api.messages.logs({ messageId: m.id });
      allLogs.push(...logs);
    }
    if (!allLogs.length) { toast('No logs to export', 'error'); return; }
    const r = await window.api.messages.exportLogs(allLogs);
    if (r.success) toast(`${allLogs.length} log entries exported`, 'success');
  }
};

        <button class="btn btn-danger btn-sm" data-confirm>Cancel message</button>

            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
            <p>No Android devices connected</p>
            <small>Enable USB Debugging on your phone and connect via USB</small>
          </div>`}
      </div>

      <!-- Modem diagnostic section (if connected) -->
      ${modem.connected ? `
      <div class="settings-section">
        <div class="settings-section-title">Modem diagnostics</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="devicesPage.testModem()">Run AT test</button>
          <button class="btn btn-sm" onclick="devicesPage.checkSignal()">Signal strength</button>
          <button class="btn btn-sm" onclick="devicesPage.readSIMContacts()">Read SIM contacts</button>
          <button class="btn btn-sm" onclick="devicesPage.readSIMSMS()">Read stored SMS</button>
        </div>
        <div id="diag-output" style="display:none;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--text-2);background:var(--bg-active);padding:10px 12px;border-radius:var(--radius);white-space:pre-wrap;line-height:1.6"></div>
      </div>` : ''}`;
  },

  async connectModem(portPath) {
    const settings = await window.api.settings.get();
    toast(`Connecting to ${portPath}...`);
    const r = await window.api.modem.connect({ port: portPath, baudRate: settings.baud_rate || '115200' });
    if (r.success) { toast('Modem connected!', 'success'); modem.connected = true; modem.port = portPath; modem._updateUI(); this.load(); }
    else toast(r.error || 'Connection failed', 'error');
  },

  async disconnectModem() {
    await window.api.modem.disconnect();
    modem.connected = false; modem._updateUI();
    toast('Modem disconnected');
    this.load();
  },

  async testModem() {
    const diag = document.getElementById('diag-output');
    if (diag) { diag.style.display = 'block'; diag.textContent = 'Running AT tests...\n'; }
    const r = await window.api.modem.test();
    if (diag) diag.textContent = r.success ? `Signal: ${r.signal}/5 bars\nAT+CSQ response: ${r.raw}\nModem OK ✓` : `Error: ${r.error}`;
  },

  async checkSignal() {
    const signal = await window.api.modem.signal();
    setSignal(signal);
    const diag = document.getElementById('diag-output');
    if (diag) { diag.style.display = 'block'; diag.textContent = `Signal strength: ${signal}/5 bars`; }
    toast(`Signal: ${signal}/5`, signal > 0 ? 'success' : 'error');
  },

  async readSIMContacts() {
    toast('Reading SIM contacts...');
    const r = await window.api.modem.readSimContacts();
    if (!r.success) { toast(r.error || 'Failed', 'error'); return; }
    showModal(`<div class="modal-title">SIM contacts (${r.contacts.length})</div>
      <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px">
        ${r.contacts.map(c=>`<div style="display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px"><span>${escHtml(c.name)}</span><span style="font-family:var(--mono);color:var(--text-3)">${escHtml(c.phone)}</span></div>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Close</button>
        <button class="btn btn-primary btn-sm" data-confirm>Import to contacts</button>
      </div>`, async () => {
        const ir = await window.api.contacts.importSim(r.contacts);
        toast(`Imported ${ir.added} (${ir.skipped} duplicates)`, 'success');
      });
  },

  async readSIMSMS() {
    toast('Reading stored SMS...');
    const r = await window.api.modem.readStoredSMS();
    if (!r.success) { toast(r.error || 'Failed', 'error'); return; }
    if (!r.messages.length) { toast('No messages found on SIM'); return; }
    showModal(`<div class="modal-title">Stored SMS (${r.messages.length})</div>
      <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px">
        ${r.messages.map(m=>`<div style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px">
          <div style="font-weight:500;font-family:var(--mono)">${escHtml(m.phone)}</div>
          <div style="color:var(--text-2);margin-top:2px">${escHtml(m.body)}</div>
          <div style="color:var(--text-3);font-size:11px;margin-top:2px">${escHtml(m.timestamp||'')}</div>
        </div>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Close</button>
        <button class="btn btn-primary btn-sm" data-confirm>Import to inbox</button>
      </div>`, async () => {
        const ir = await window.api.inbox.importFromModem();
        toast(`Imported ${ir.added} messages`, 'success');
      });
  },

  async readAndroidContacts(deviceId, model) {
    toast(`Reading contacts from ${model}...`);
    const r = await window.api.android.importContacts({ deviceId });
    if (r.success) toast(`Imported ${r.added} contacts from ${model} (${r.skipped} duplicates)`, 'success');
    else toast(r.error || 'Failed to read contacts', 'error');
  },

  async readAndroidSMS(deviceId) {
    toast('Reading SMS from phone...');
    const r = await window.api.android.importSMS({ deviceId });
    if (r.success) { toast(`Imported ${r.added} messages to inbox`, 'success'); }
    else toast(r.error || 'Failed to read SMS', 'error');
  },

  showADBSetup() {
    showModal(`<div class="modal-title">Installing ADB</div>
      <div style="font-size:13px;line-height:1.9;color:var(--text-2)">
        <strong>Step 1 — Download</strong><br>
        Go to <span style="color:var(--blue);font-family:var(--mono);font-size:12px">developer.android.com/tools/releases/platform-tools</span><br>
        Download "SDK Platform-Tools for Windows"<br><br>
        <strong>Step 2 — Install</strong><br>
        Extract the ZIP. Copy <code style="background:var(--bg-active);padding:1px 5px;border-radius:3px">adb.exe</code>, <code style="background:var(--bg-active);padding:1px 5px;border-radius:3px">AdbWinApi.dll</code>, and <code style="background:var(--bg-active);padding:1px 5px;border-radius:3px">AdbWinUsbApi.dll</code> to:<br>
        <code style="background:var(--bg-active);padding:2px 8px;border-radius:3px;font-size:11px;display:inline-block;margin-top:4px">C:\\Program Files\\MassTxt\\resources\\adb\\</code><br><br>
        <strong>Step 3 — Phone setup</strong><br>
        • Settings → About phone → tap Build number 7 times<br>
        • Settings → Developer options → Enable USB debugging<br>
        • Connect USB → tap "Allow" on phone<br><br>
        <strong>Step 4</strong><br>
        Click Refresh in MassTxt to detect your phone.
      </div>
      <div class="modal-footer"><button class="btn btn-primary btn-sm" data-cancel>Got it</button></div>`);
  }
};

// ── Page: settings ──────────────────────────────────────────

        <div class="settings-section">

          <div class="form-row form-row-3">
            <div class="form-group">
              <label class="form-label">Delay between messages (ms)</label>
              <input class="form-input" type="number" id="s-delay" value="${this.settings.msg_delay_ms || 800}" min="300" max="30000">
              <div style="font-size:11px;color:var(--text-3);margin-top:3px">Min 300ms recommended</div>

            <div class="form-group">
              <label class="form-label">Retry failed messages</label>
              <select class="form-input" id="s-retry">
                <option value="0" ${this.settings.retry_count === '0' ? 'selected':''}>Never</option>
                <option value="1" ${this.settings.retry_count === '1' ? 'selected':''}>1 time</option>
                <option value="2" ${this.settings.retry_count === '2' ? 'selected':''}>2 times</option>
                <option value="3" ${this.settings.retry_count === '3' ? 'selected':''}>3 times</option>

            <div class="form-group">
              <label class="form-label">Max SMS parts per message</label>
              <select class="form-input" id="s-parts">
                <option value="1" ${this.settings.max_sms_parts === '1' ? 'selected':''}>1 (160 chars)</option>

              Desktop notification when SMS is received in inbox

            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px">
              <input type="checkbox" id="s-notify-fail" ${this.settings.notify_on_fail === '1' ? 'checked' : ''}>
              Desktop notification when a message fails to send
            </label>

        <!-- Contacts -->

          <div class="settings-section-title">Contacts</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-sm" onclick="settingsPage.findDuplicates()">Find duplicate contacts</button>
          </div>
          <div id="dup-result" style="margin-top:10px"></div>
        </div>

        <!-- Data & Backup -->
        <div class="settings-section">
          <div class="settings-section-title">Data & backup</div>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">
            All data is stored locally in a SQLite database. Back it up regularly.
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-sm" onclick="settingsPage.backup()">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M4 6l4 4 4-4M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Backup database
            </button>
            <button class="btn btn-sm" onclick="settingsPage.restore()">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 15V6M4 10l4-4 4 4M2 3h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Restore backup
            </button>
            <button class="btn btn-sm" onclick="settingsPage.openDataFolder()">Open data folder</button>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:8px">
            Database: <code style="font-family:var(--mono)">${escHtml(appInfo.dbPath || '')}</code>
          </div>
        </div>

        <!-- Modem diagnostics -->
        <div class="settings-section">
          <div class="settings-section-title">Modem diagnostics</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-sm" onclick="settingsPage.testModem()">Test AT commands</button>
            <button class="btn btn-sm" onclick="settingsPage.checkSignal()">Check signal</button>
          </div>
          <div id="diag-output" style="display:none;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--text-2);background:var(--bg-active);padding:10px 12px;border-radius:var(--radius);white-space:pre-wrap;line-height:1.6"></div>

        <div class="settings-section">

            <tr><td style="color:var(--text-2);padding:4px 16px 4px 0">Platform</td><td>${escHtml(appInfo.platform || '')} / ${escHtml(appInfo.arch || '')}</td></tr>

            <tr><td style="color:var(--text-2);padding:4px 16px 4px 0">Electron</td><td style="font-family:var(--mono);font-size:12px">${escHtml(appInfo.electronVersion || '')}</td></tr>
            <tr><td style="color:var(--text-2);padding:4px 16px 4px 0">Data folder</td><td style="font-family:var(--mono);font-size:11px">${escHtml(appInfo.userData || '')}</td></tr>

  selectPort(path) {
    document.getElementById('s-port').value = path;
    document.querySelectorAll('.port-card').forEach(c => c.classList.remove('selected'));
    event?.currentTarget?.classList?.add('selected');
  },

  async refreshPorts() {
    this.ports    = await window.api.modem.listPorts();
    this.settings = await window.api.settings.get();
    this.render();
  },

  async toggleConnect() {
    const btn = document.getElementById('connect-btn');
    if (modem.connected) {
      await window.api.modem.disconnect();
      modem.connected = false; modem._updateUI();
      if (btn) btn.textContent = 'Connect';
      toast('Modem disconnected');
    } else {
      const port     = document.getElementById('s-port')?.value.trim();
      const baudRate = document.getElementById('s-baud')?.value;
      if (btn) { btn.textContent = 'Connecting…'; btn.disabled = true; }
      const r = await window.api.modem.connect({ port, baudRate });
      if (btn) { btn.disabled = false; }
      if (r.success) {
        modem.connected = true; modem.port = port; modem._updateUI();
        if (btn) btn.textContent = 'Disconnect';
        toast('Modem connected on ' + port, 'success');
      } else {
        if (btn) btn.textContent = 'Connect';
        toast(r.error || 'Connection failed', 'error');
      }
    }
  },

  async testModem() {
    const el = document.getElementById('diag-output');
    if (el) { el.style.display = 'block'; el.textContent = 'Running AT tests…\n'; }
    const r = await window.api.modem.test();
    if (el) el.textContent = r.success
      ? `AT+CSQ response:\n${r.raw}\nSignal strength: ${r.signal}/5 bars\nModem OK ✓`
      : `Error: ${r.error}`;
  },

  async checkSignal() {
    const signal = await window.api.modem.signal();
    setSignal(signal);
    const el = document.getElementById('diag-output');
    if (el) { el.style.display = 'block'; el.textContent = `Signal: ${signal}/5 bars`; }
    toast(`Signal: ${signal}/5`, signal > 0 ? 'success' : 'error');
  },

  async findDuplicates() {
    const dupes = await window.api.contacts.findDuplicates();
    const el = document.getElementById('dup-result');
    if (!el) return;
    if (!dupes.length) {
      el.innerHTML = '<span style="font-size:13px;color:var(--green-text)">✓ No duplicates found</span>';
      return;
    }
    el.innerHTML = `
      <div style="font-size:13px;color:var(--amber-text);margin-bottom:8px">Found ${dupes.length} duplicate phone number${dupes.length !== 1 ? 's' : ''}.</div>
      <div style="max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px">
        ${dupes.map(d => `<div style="padding:6px 12px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between">
          <span style="font-family:var(--mono)">${escHtml(d.phone)}</span>
          <span style="color:var(--text-3)">${escHtml(d.names)}</span>
          <span class="badge badge-amber">${d.cnt} entries</span>
        </div>`).join('')}
      </div>
      <button class="btn btn-sm btn-danger" onclick="settingsPage.removeDuplicates()">Remove duplicates (keep first entry each)</button>`;
  },

  async removeDuplicates() {
    const r = await window.api.contacts.removeDuplicates();
    if (r.success) {
      toast(`Removed ${r.removed} duplicate contact${r.removed !== 1 ? 's' : ''}`, 'success');
      document.getElementById('dup-result').innerHTML = '<span style="font-size:13px;color:var(--green-text)">✓ Duplicates removed</span>';
    }
  },

  async backup() {
    const r = await window.api.db.backup();
    if (r.success) toast('Database backed up successfully', 'success');
    else if (!r.canceled) toast(r.error || 'Backup failed', 'error');
  },

  async restore() {
    showModal(`<div class="modal-title">Restore database</div>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:8px">
        <strong>Warning:</strong> This will replace all current data (contacts, messages, settings) with the backup file. This cannot be undone.
      </p>
      <div class="modal-footer">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-danger btn-sm" data-confirm>Restore from backup</button>
      </div>`, async () => {
        const r = await window.api.db.restore();
        if (r.success) { toast('Database restored. Restarting…', 'success'); setTimeout(() => location.reload(), 1500); }
        else if (!r.canceled) toast(r.error || 'Restore failed', 'error');
      });
  },

  async openDataFolder() {
    await window.api.db.openFolder();
  },

  async save() {
    const updates = {
      com_port:             document.getElementById('s-port')?.value.trim()    || 'COM3',
      baud_rate:            document.getElementById('s-baud')?.value            || '115200',
      sender_id:            document.getElementById('s-sender')?.value.trim()  || '',
      default_country_code: document.getElementById('s-country')?.value.trim() || '+256',
      msg_delay_ms:         document.getElementById('s-delay')?.value           || '800',
      retry_count:          document.getElementById('s-retry')?.value           || '2',
      max_sms_parts:        document.getElementById('s-parts')?.value           || '3',
      sms_mode:             document.getElementById('s-smsmode')?.value         || 'text',
      default_sms_type:     document.getElementById('s-msgtype')?.value         || 'normal',
      flash_dcs:            document.getElementById('s-flashdcs')?.value        || '240',
      notify_on_receive:    document.getElementById('s-notify-receive')?.checked ? '1' : '0',
      notify_on_fail:       document.getElementById('s-notify-fail')?.checked   ? '1' : '0',
    };
    const r = await window.api.settings.set(updates);
    if (r.success) toast('Settings saved', 'success');
    else toast('Save failed', 'error');
  }
};

</script>
<script>
// ── Override devices page to use WebSerial connect button ─────
const _origDevicesRender = devicesPage.render.bind(devicesPage);
devicesPage.render = async function() {

  document.getElementById('page-devices').innerHTML = `
    <div class="page-header">
      <div class="page-title">Devices</div>
      <div class="header-actions"><button class="btn btn-sm" onclick="devicesPage.render()">Refresh</button></div>
    </div>

devicesPage.connectModem = async function() {
  if (!navigator.serial) { toast('WebSerial not supported. Use Chrome or Edge.', 'error'); return; }
  try {
    const port = await Modem.requestPort();
    const baud = parseInt(document.getElementById('dev-baud')?.value || '115200');
    toast('Connecting to modem…');
    await Modem.connect(port, baud);
    modem.connected = true; modem.port = Modem.portInfo; modem._updateUI();
    setSignal(Modem.signalStrength);
    toast('Modem connected!', 'success');
    this.render();
    await window.api.settings.set({ com_port: 'WebSerial', baud_rate: String(baud) });
  } catch(e) {
    toast(e.message || 'Connection failed', 'error');
  }
};

devicesPage.disconnectModem = async function() {
  await Modem.disconnect();
  modem.connected = false; modem._updateUI();
  toast('Modem disconnected');
  this.render();
};

devicesPage.testModem = async function() {
  const el = document.getElementById('diag-output');
  if (el) { el.style.display = 'block'; el.textContent = 'Testing…\n'; }

  if (el) el.textContent = r.success ? `AT+CSQ: ${r.raw}\nSignal: ${r.signal}/5 ✓` : `Error: ${r.error}`;
};

devicesPage.checkSignal = async function() {
  const s = await Modem.getSignal();
  setSignal(s);
  const el = document.getElementById('diag-output');
  if (el) { el.style.display='block'; el.textContent = `Signal: ${s}/5 bars`; }
  toast(`Signal: ${s}/5`);
};

const pagesRouter = {
  current: 'dashboard',
  pageMap: { dashboard:dashboardPage, compose:composePage, inbox:inboxPage, templates:templatesPage, contacts:contactsPage, groups:groupsPage, logs:logsPage, scheduled:scheduledPage, devices:devicesPage, settings:settingsPage },
  load(page) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('page-' + page);
    if (!el) return;
    el.style.display = 'flex';
    const nav = document.querySelector(`.nav-item[data-page="${page}"]`);
    if (nav) nav.classList.add('active');
    if (this.pageMap[page]) this.pageMap[page].render();
    this.current = page;
  }
};

(async () => {
  await DB.open();
  await Settings.load();

  // Seed default groups if empty
  const groups = await DB.getAll('groups');
  if (!groups.length) {
    for (const name of ['General','Customers','Staff','VIP'])
      await DB.add('groups', { name, description: '', created_at: new Date().toISOString() });
  }

  // Seed default templates if empty
  const templates = await DB.getAll('templates');
  if (!templates.length) {
    const defaults = [
      { name:'Welcome',           body:'Dear {name}, welcome! We are glad to have you with us.',                      category:'Onboarding' },
      { name:'Payment reminder',  body:'Dear {name}, your payment of {amount} is due on {date}. Please pay promptly.', category:'Finance'    },
      { name:'Appointment',       body:'Dear {name}, reminder: your appointment is on {date} at {time}.',              category:'Appointments'},
      { name:'Promotion',         body:'Dear {name}, exclusive offer: {offer}. Valid until {date}. Terms apply.',      category:'Marketing'  },
    ];
    for (const t of defaults) await DB.add('templates', { ...t, use_count: 0, created_at: new Date().toISOString() });
  }

  // Nav clicks
  document.querySelectorAll('.nav-item[data-page]').forEach(item => {
    item.addEventListener('click', () => pagesRouter.load(item.dataset.page));
  });

  modem.init();

  // Inbox badge
  window.api.inbox.onNew(() => window.api.inbox.unreadCount().then(c => setNavBadge('inbox', c)));

  // Load badge counts
  const [msgs, unread] = await Promise.all([
    window.api.messages.list({ limit: 200 }),
    window.api.inbox.unreadCount(),
  ]);
  setNavBadge('inbox', unread);
  setNavBadge('sched', msgs.filter(m => m.status === 'scheduled').length);

  // Show WebSerial warning if not supported
  if (!navigator.serial) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#C62828;color:#fff;padding:10px 20px;font-size:13px;z-index:999;display:flex;align-items:center;justify-content:space-between;';
    banner.innerHTML = '<span>⚠ WebSerial not available — Open in <strong>Google Chrome</strong> or <strong>Microsoft Edge</strong> to use your GSM modem.</span><span onclick="this.parentNode.remove()" style="cursor:pointer;font-size:18px">×</span>';
    document.body.prepend(banner);
  }

  // Load dashboard
  pagesRouter.load('dashboard');
  
  // Scheduled message checker - every 60 seconds
  setInterval(async () => {
    const msgs = await DB.getAll('messages');
    const now = new Date();
    for (const m of msgs.filter(x => x.status === 'scheduled' && x.scheduled_at)) {
      if (new Date(m.scheduled_at) <= now) {
        executeBulkSend(m.id, d => { if (window._onSendProgress) window._onSendProgress(d); });
      }
    }
  }, 60000);

  // Signal poll every 30s
  setInterval(async () => {
    if (Modem.connected) { await Modem.getSignal(); setSignal(Modem.signalStrength); }
  }, 30000);

})();

// ═══════════════════════════════════════════════════════════
//  Bluetooth SMS Support
//  Uses Windows Bluetooth virtual COM port (RFCOMM/DUN)
//  Android paired phone appears as a serial COM port
//  AT commands work identically to USB modem
// ═══════════════════════════════════════════════════════════

const BluetoothManager = {
  pairedDevice: null,
  portName: null,

  // Scan for Bluetooth COM ports using Web Bluetooth + port listing
  async findBluetoothPorts() {
    const ports = await Modem.listPorts();
    // Bluetooth COM ports typically have "Bluetooth" in manufacturer
    // or are higher COM numbers (COM5+) on Windows
    return ports.filter(p => {
      const mfr = (p.info?.manufacturer || '').toLowerCase();
      const path = (p.path || '').toUpperCase();
      return mfr.includes('bluetooth') || 
             mfr.includes('bthenum') ||
             mfr.includes('widcomm') ||
             (path.match(/COM\d+/) && parseInt(path.replace('COM','')) >= 5);
    });
  },

  // Connect to Bluetooth phone as modem
  async connect(portPath, baudRate = 9600) {
    // BT serial usually uses 9600 baud
    if (!navigator.serial) throw new Error('WebSerial required');
    const ports = await navigator.serial.getPorts();
    let port = ports.find(p => p.getInfo()?.comPort === portPath);
    
    if (!port) {
      // Request user to select the BT port
      port = await navigator.serial.requestPort({
        filters: [] // Show all ports including Bluetooth
      });
    }
    
    await Modem.connect(port, baudRate);
    this.portName = portPath;
    return true;
  },

  isConnected() { return Modem.connected && this.portName; }
};

devicesPage.connectBluetooth = async function() {
  if (!navigator.serial) { toast('WebSerial required — use Chrome or Edge', 'error'); return; }
  
  const statusEl = document.getElementById('bt-status');
  if (statusEl) statusEl.textContent = 'Scanning for Bluetooth COM ports…';
  
  try {
    // Request port - user picks from the list
    // Bluetooth phones appear as COM ports in Windows
    toast("Select your Bluetooth phone's COM port from the popup\u2026");
    const port = await navigator.serial.requestPort({ filters: [] });
    const info = port.getInfo();
    
    if (statusEl) statusEl.textContent = 'Connecting… (trying 9600 baud first)';
    
    // Try connecting at 9600 first (standard BT serial), then 115200
    let connected = false;
    for (const baud of [9600, 115200, 38400]) {
      try {
        await Modem.connect(port, baud);
        connected = true;
        BluetoothManager.portName = `BT:${baud}`;
        break;
      } catch(e) {
        try { await Modem.disconnect(); } catch(e2) {}
      }
    }

    if (connected) {
      modem.connected = true;
      modem.port = `Bluetooth (${BluetoothManager.portName})`;
      modem._updateUI();
      setSignal(Modem.signalStrength);
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--green-text)">● Bluetooth phone connected and ready!</span>';
      toast('Bluetooth phone connected!', 'success');
      await window.api.settings.set({ com_port: 'Bluetooth', baud_rate: '9600' });
    } else {
      if (statusEl) statusEl.textContent = 'Could not connect. Make sure phone is paired and BT modem mode is on.';
      toast('Bluetooth connection failed', 'error');
    }
  } catch(e) {
    if (e.name === 'NotFoundError') {
      if (statusEl) statusEl.textContent = 'No port selected.';
    } else {
      if (statusEl) statusEl.textContent = 'Error: ' + e.message;
      toast(e.message, 'error');
    }
  }
};

// ════════════════════════════════════════════════════════════
//  Smart Port Labeler
//  Converts COM3, COM6 etc into friendly labelled names
//  e.g.  COM3 [USB Modem — Huawei]
//        COM5 [Bluetooth — Samsung]
//        COM7 [USB Serial]
// ════════════════════════════════════════════════════════════

function labelPort(port) {
  const path = (port.path || port || '').toString().toUpperCase();
  const mfr  = (port.manufacturer || port.info?.manufacturer || '').toLowerCase();
  const pnp  = (port.pnpId || port.info?.pnpId || '').toLowerCase();
  const vid  = port.vendorId  || port.info?.usbVendorId  || '';
  const pid  = port.productId || port.info?.usbProductId || '';

  // ── Detect type from manufacturer / pnpId strings ────────
  const isBluetooth = mfr.includes('bluetooth') || mfr.includes('bthenum') ||
                      mfr.includes('widcomm')   || mfr.includes('btstack') ||
                      pnp.includes('bthenum')   || pnp.includes('bluetooth');

  const isUSBModem  = mfr.includes('huawei')   || mfr.includes('zte')    ||
                      mfr.includes('alcatel')   || mfr.includes('sierra') ||
                      mfr.includes('novatel')   || mfr.includes('option') ||
                      mfr.includes('wavecom')   || mfr.includes('telit')  ||
                      mfr.includes('simcom')    || mfr.includes('quectel')||
                      mfr.includes('modem')     ||
                      pnp.includes('vid_12d1')  || // Huawei VID
                      pnp.includes('vid_19d2')  || // ZTE VID
                      pnp.includes('vid_0421')  || // Nokia
                      pnp.includes('vid_03f0');    // HP modems

  const isAndroid   = mfr.includes('android')  || mfr.includes('google') ||
                      pnp.includes('vid_18d1')  || // Google/Android VID
                      pnp.includes('vid_04e8')  || // Samsung
                      pnp.includes('vid_2717')  || // Xiaomi
                      pnp.includes('vid_12d1');    // Huawei phones

  const isArduino   = mfr.includes('arduino')  || pnp.includes('vid_2341');
  const isFTDI      = mfr.includes('ftdi')     || pnp.includes('vid_0403');
  const isSilicon   = mfr.includes('silicon')  || pnp.includes('vid_10c4'); // CP210x
  const isCH340     = mfr.includes('ch340')    || mfr.includes('wch')    ||
                      pnp.includes('vid_1a86');

  // ── Get friendly device brand ─────────────────────────────
  let brand = '';
  if (mfr.includes('huawei'))  brand = 'Huawei';
  else if (mfr.includes('zte'))    brand = 'ZTE';
  else if (mfr.includes('alcatel'))brand = 'Alcatel';
  else if (mfr.includes('sierra')) brand = 'Sierra';
  else if (mfr.includes('samsung'))brand = 'Samsung';
  else if (mfr.includes('xiaomi')) brand = 'Xiaomi';
  else if (mfr.includes('oppo'))   brand = 'Oppo';
  else if (mfr.includes('tecno'))  brand = 'Tecno';
  else if (mfr.includes('itel'))   brand = 'Itel';
  else if (mfr.includes('infinix'))brand = 'Infinix';
  else if (mfr.includes('nokia'))  brand = 'Nokia';
  else if (mfr)                    brand = mfr.split(' ').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ').substring(0,20);

  // ── Build the label ───────────────────────────────────────
  let type  = '';
  let color = '';
  let icon  = '';

  if (isBluetooth) {
    type  = 'Bluetooth';
    color = '#185FA5';   // blue
    icon  = '📶';
    if (brand) type += ' — ' + brand;
  } else if (isUSBModem) {
    type  = 'USB Modem';
    color = '#0D7377';   // teal
    icon  = '📡';
    if (brand) type += ' — ' + brand;
  } else if (isAndroid) {
    type  = 'Android Phone';
    color = '#3b6d11';   // green
    icon  = '📱';
    if (brand) type += ' — ' + brand;
  } else if (isArduino) {
    type  = 'Arduino';
    color = '#085458';
    icon  = '⚡';
  } else if (isFTDI || isSilicon || isCH340) {
    type  = 'USB Serial';
    color = '#854f0b';   // amber
    icon  = '🔌';
    if (brand) type += ' — ' + brand;
  } else {
    // Unknown — show COM number with generic label
    const comNum = path.match(/COM(\d+)/)?.[1];
    if (comNum && parseInt(comNum) >= 5) {
      type = 'USB Device';   // higher COM numbers are usually USB
      color = '#854f0b';
      icon  = '🔌';
    } else {
      type  = 'Serial Port';
      color = '#5c5a54';
      icon  = '⚙';
    }
    if (brand) type += ' — ' + brand;
  }

  return {
    path,
    type,
    color,
    icon,
    brand,
    label:     `${path}  [${type}]`,
    shortLabel:`${path}`,
    badge:     type,
    badgeColor:color,
    raw:       port,
  };
}

const _origSettingsRender = settingsPage.render.bind(settingsPage);

// ── Override modem sidebar label to show friendly name ────────
const _origModemUpdateUI = modem._updateUI.bind(modem);
modem._updateUI = function() {
  _origModemUpdateUI();
  // Enhance the label
  const label = document.getElementById('modem-label');
  if (label && this.connected && this.port) {
    const info = labelPort({ path: this.port, manufacturer: '' });
    label.innerHTML = `<span style="color:rgba(255,255,255,0.9)">${info.path}</span> <span style="color:rgba(255,255,255,0.45);font-size:10px">${info.badge}</span>`;
  }
};

// ── Patch Modem.connect to store friendly port info ───────────
const _origModemConnect = Modem.connect.bind(Modem);
Modem.connect = async function(port, baudRate) {
  await _origModemConnect(port, baudRate);
  // Get the port info and label it
  const info = port.getInfo?.() || {};
  const portPath = `COM?`;
  const mfrHint  = info.usbVendorId ? `USB:${info.usbVendorId}` : 'Serial';
  const labeled  = labelPort({ path: portPath, manufacturer: mfrHint, pnpId: '', ...info });
  this.portInfo = `${labeled.path} [${labeled.badge}]`;
  modem._updateUI();
};
